# Workflow voor de repo LRvdLinden/app.lrvdlinden.secrets (kopie van .github/workflows/lrbeheer-push.yml daar).
# Zet de centrale functie `lrbeheer` van LRbeheer (pushmeldingen en het Bekendr-beheer) live in het Supabase-project van
# Tunr. Alleen met de hand te starten (Actions → LRbeheer push → Run workflow).
#
# Het deployen zelf gebeurt in LRvdLinden/tunr-beheer (workflow *LRbeheer*, lrbeheer.yml), met het SUPABASE_ACCESS_TOKEN
# dat daar al staat. Deze workflow zet eerst de benodigde waarden uit deze repo als secrets in tunr-beheer en start
# daarna die workflow. Geen enkele waarde komt in het log (gh secret set leest van stdin).
#
# Gebruikt de secrets hier:
#   APN_KEY_ID, APN_P8_CERT, TEAM_ID                       APNs-sleutel (verplicht)
#   FINE_GRAINED_PERSONAL_ACCESS_TOKEN                     Secrets + Actions: Read and write op tunr-beheer (verplicht)
#   SUPABASE_ACCESS_TOKEN                                  optioneel; staat het hier, dan vervangt het dat van tunr-beheer
#   BEHEER_APP_USER, BEHEER_APP_PASSWORD                   gedeelde beheer-inlog (Bekendr-beheer)
#   KEY_ID_APPSTORE_CONNECT, ISSUER_ID_APPSTORE_CONNECT,
#   VENDOR_APPSTORE_CONNECT                                App Store Connect (Bekendr: Apple-downloads)
#   P8_APPSTORE_CONNECT                                    .p8 van die API-sleutel; zonder dit wordt APN_P8_CERT alleen
#                                                          gebruikt als KEY_ID_APPSTORE_CONNECT gelijk is aan APN_KEY_ID
name: LRbeheer push

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.FINE_GRAINED_PERSONAL_ACCESS_TOKEN }}
      R: LRvdLinden/tunr-beheer
    steps:
      - name: Secrets naar tunr-beheer
        env:
          APN_KEY_ID: ${{ secrets.APN_KEY_ID }}
          APN_P8_CERT: ${{ secrets.APN_P8_CERT }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          B_USER: ${{ secrets.BEHEER_APP_USER }}
          B_PASS: ${{ secrets.BEHEER_APP_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.KEY_ID_APPSTORE_CONNECT }}
          ASC_ISSUER_ID: ${{ secrets.ISSUER_ID_APPSTORE_CONNECT }}
          ASC_P8: ${{ secrets.P8_APPSTORE_CONNECT }}
          ASC_VENDOR: ${{ secrets.VENDOR_APPSTORE_CONNECT || secrets.VENDOR_NUMBER_APPSTORE_CONNECT }}
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCES_TOKEN }}
        run: |
          missing=""
          for v in GH_TOKEN APN_KEY_ID APN_P8_CERT; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::Ontbrekende secrets:$missing"; exit 1; fi
          if [ -z "$ASC_P8" ] && [ -n "$ASC_KEY_ID" ] && [ "$ASC_KEY_ID" = "$APN_KEY_ID" ]; then ASC_P8="$APN_P8_CERT"; fi
          failed=0
          put() { # naam waarde
            [ -n "$2" ] || return 0
            printf '%s' "$2" | gh secret set "$1" --repo "$R" > /dev/null 2>&1 || { echo "::error::$1 zetten in $R mislukt (token heeft Secrets: Read and write nodig)"; failed=1; }
          }
          put LRBEHEER_APN_KEY_ID "$APN_KEY_ID"
          put LRBEHEER_APN_P8 "$APN_P8_CERT"
          put LRBEHEER_TEAM_ID "${TEAM_ID:-EU3UY476T6}"
          put LRBEHEER_GH_READ "$GH_TOKEN"
          put LRBEHEER_ADMIN_USER "$B_USER"
          put LRBEHEER_ADMIN_PASSWORD "$B_PASS"
          put LRBEHEER_ASC_KEY_ID "$ASC_KEY_ID"
          put LRBEHEER_ASC_ISSUER_ID "$ASC_ISSUER_ID"
          put LRBEHEER_ASC_KEY_P8 "$ASC_P8"
          put LRBEHEER_ASC_VENDOR "$ASC_VENDOR"
          if [ -n "$SB_TOKEN" ]; then put SUPABASE_ACCESS_TOKEN "$SB_TOKEN" && echo "::notice::SUPABASE_ACCESS_TOKEN bijgewerkt in $R"; fi
          [ "$failed" = 0 ] || exit 1
          [ -n "$ASC_P8" ] || echo "::warning::Geen .p8 voor App Store Connect (P8_APPSTORE_CONNECT): Bekendr telt alleen Android"
          [ -n "$ASC_VENDOR" ] || echo "::warning::VENDOR_APPSTORE_CONNECT ontbreekt: Bekendr telt alleen Android"
          echo "::notice::Secrets gezet in $R"

      - name: Deploy starten in tunr-beheer
        run: |
          gh workflow run lrbeheer.yml --repo "$R" --ref main > /dev/null 2>&1 \
            || { echo "::error::Workflow LRbeheer in $R starten mislukt (token heeft Actions: Read and write nodig)"; exit 1; }
          echo "::notice::Workflow LRbeheer gestart in $R"
