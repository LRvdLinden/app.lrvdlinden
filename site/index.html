<style>
/* Layout: één kolom — intro, uitgelichte nieuwkomers, filterbare iOS-grid, Homey-sectie. Alle inhoud komt uit apps.json. */
:root{
  --bg:#F3F5F9;--surface:#FFFFFF;--ink:#121726;--muted:#5D6578;--line:#DDE2EC;
  --accent:#2747E8;--accent-soft:#E6EBFF;--build:#B4530D;--build-soft:#FFF0E3;
  --beta:#0F766E;--beta-soft:#E0F4F1;--star:#E3A008;--on-accent:#FFFFFF;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hd-widget .wl{display:none}:root:not([data-theme="light"]) .hd-widget .wd{display:block}}
:root[data-theme="dark"] .hd-widget .wl{display:none}
:root[data-theme="dark"] .hd-widget .wd{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1018;--surface:#161B27;--ink:#E9ECF4;--muted:#98A0B3;--line:#262D3D;
  --accent:#8A9DFF;--accent-soft:#1D2547;--build:#F2A15E;--build-soft:#2E2016;
  --beta:#5EC8B8;--beta-soft:#13302C;--star:#F5C04A;--on-accent:#0D1018;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1018;--surface:#161B27;--ink:#E9ECF4;--muted:#98A0B3;--line:#262D3D;
  --accent:#8A9DFF;--accent-soft:#1D2547;--build:#F2A15E;--build-soft:#2E2016;
  --beta:#5EC8B8;--beta-soft:#13302C;--star:#F5C04A;--on-accent:#0D1018;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-size:12.5px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

header.top{padding-block:24px 8px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-display);font-weight:700;font-size:18px}
.brand svg{width:36px;height:36px;display:block}
.right{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.right nav{display:flex;gap:18px;font-size:14.5px;color:var(--muted)}
.right nav a{text-decoration:none}
.right nav a:hover{color:var(--ink)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--surface)}
.lang button{font:600 12.5px var(--f-body);letter-spacing:.04em;border:0;background:none;color:var(--muted);padding:5px 11px;border-radius:99px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.intro{padding-block:52px 36px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;align-items:end}
.intro h1{font-size:clamp(40px,6.4vw,76px);line-height:.98;font-weight:800;letter-spacing:-.035em;margin-top:14px}
.intro h1 em{font-style:normal;color:var(--accent)}
.intro p{color:var(--muted);max-width:44ch;margin:0 0 6px}
.stats{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{font-size:13px;color:var(--muted)}

.section{padding-block:40px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-head h2{font-size:clamp(24px,3vw,32px);font-weight:700;letter-spacing:-.02em}
.sec-head p{margin:0;color:var(--muted);font-size:14.5px}

.lab{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}
.lab-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.lab-card h3{font-size:24px;font-weight:700;letter-spacing:-.02em}
.lab-card p{margin:0;color:var(--muted);font-size:15px}
.lab-card .plat{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.lab-card .btn{align-self:flex-start}
.lab-top{display:flex;align-items:center;gap:14px}

.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--build-soft);color:var(--build)}
.pill.live{background:var(--accent-soft);color:var(--accent)}
.pill.beta{background:var(--beta-soft);color:var(--beta)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
@media (prefers-reduced-motion:no-preference){.pill.dev::before,.pill.beta::before{animation:blink 2.4s ease-in-out infinite}}
@keyframes blink{50%{opacity:.25}}
.tag{font-size:12px;padding:3px 9px;border-radius:7px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}

.icon{width:60px;height:60px;border-radius:14px;flex:none;position:relative;overflow:hidden;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;color:#fff;background:var(--ink);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.icon.lg{width:72px;height:72px;border-radius:17px;font-size:26px}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{font:500 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:99px;cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:11.5px;opacity:.6;margin-left:4px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.app{display:grid;grid-template-columns:60px minmax(0,1fr);gap:14px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.app:hover{border-color:var(--muted)}
.app[aria-expanded="true"]{border-color:var(--accent)}
.app h3{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.app .cat{font-size:13px;color:var(--muted)}
.app .meta{display:flex;gap:12px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.stars{color:var(--star);letter-spacing:1px}

.detail{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.detail.single{grid-template-columns:minmax(0,1fr)}
.detail h3{font-size:28px;font-weight:700;letter-spacing:-.02em}
.detail .lead{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.detail p{margin:0 0 14px;color:var(--muted);max-width:60ch}
.detail .plat{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 16px}
.facts div{background:var(--surface);padding:10px 12px}
.facts dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 14.5px var(--f-body);padding:10px 18px;border-radius:99px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.history h4{font-family:var(--f-display);font-size:16px;margin:0 0 10px}
.history ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.history li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;font-size:14px}
.history .d{color:var(--muted);font-size:12px}
.history li p{margin:0;color:var(--muted)}

.homey{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.homey-intro{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 20px;align-items:center}
.homey-intro > .icon{grid-row:1 / span 3}
.homey-intro .btns{grid-column:3;grid-row:1 / span 3;justify-content:flex-end}
.homey h2{font-size:clamp(24px,3vw,32px);letter-spacing:-.02em;margin-top:10px}
.homey-intro p{color:var(--muted);margin:0;max-width:62ch}
.homey-intro h2{margin-top:0}
.homey-intro > .icon{background:#fff}
.homey ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;align-self:start}
.homey li{background:var(--surface);min-width:0}
.homey li .hitem{display:grid;grid-template-columns:40px minmax(0,1fr) 16px;gap:12px;padding:14px 16px;height:100%;width:100%;text-align:left;background:none;border:0;font:inherit;color:inherit;cursor:pointer}
.homey li .hitem:hover{background:var(--bg)}
.homey li .hitem[aria-expanded="true"]{background:var(--accent-soft)}
.homey li .chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:8px;transition:transform .2s}
.homey li .hitem[aria-expanded="true"] .chev{transform:rotate(-135deg);margin-top:12px}
@media (prefers-reduced-motion:reduce){.homey li .chev{transition:none}}

/* Uitgeklapte Homey-app, zoals in de Homey App Store */
.homey li.hdetail{grid-column:1/-1;padding:24px;background:var(--surface)}
.hd-head{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:center;margin-bottom:18px}
.hd-head h3{font-size:24px;letter-spacing:-.02em;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hd-head .sub{font-size:14px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.hd-close{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:18px;line-height:1}
.hd-desc{color:var(--muted);margin:0 0 14px;max-width:70ch}
.hd-facts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.hd-sec{margin-top:24px}
.hd-sec h4{font-family:var(--f-display);font-size:17px;margin:0 0 12px;display:flex;align-items:baseline;gap:8px}
.hd-sec h4 small{font:500 13px var(--f-body);color:var(--muted)}
.hd-drivers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.hd-driver{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-weight:600;font-size:14px;min-width:0}
.hd-driver .img{width:84px;height:84px;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden}
.hd-driver .img img{width:100%;height:100%;object-fit:contain}
.hd-driver .img.ic{background:var(--hc,#2747E8)}
.hd-driver .img.ic img{width:56%;height:56%;filter:brightness(0) invert(1)}
.hd-widgets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.hd-widget{margin:0;min-width:0}
.hd-widget img{width:100%;height:auto;min-height:96px;object-fit:contain;border-radius:14px;border:1px solid var(--line);background:var(--bg);display:block}
.hd-widget figcaption{font-size:14px;font-weight:600;margin-top:8px}
.hd-widget .wd{display:none}
.hd-flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.hd-col{min-width:0}
.hd-col h5{margin:0 0 8px;font:700 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.hd-col h5::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--fc)}
.hd-col.when{--fc:#E8A317}.hd-col.and{--fc:#2F80ED}.hd-col.then{--fc:#22A06B}
.hd-col ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hd-col li{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;background:var(--bg);min-width:0;overflow-wrap:anywhere}
.hd-col li.more{display:none}
.hd-col.open li.more{display:block}
.hd-col .showall{margin-top:8px;font:600 13px var(--f-body);background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0}
.hd-news{display:flex;flex-direction:column;gap:10px}
.hd-news > div{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px;font-size:14px}
.hd-news .v{font-family:var(--f-mono);font-size:12.5px}
.hd-news .d{color:var(--muted);font-size:12px}
.hd-news p{margin:0;color:var(--muted);white-space:pre-line}
.homey .hitem .icon{width:40px;height:40px;border-radius:10px;margin:0;font-size:14px}
.homey .hitem b{font-family:var(--f-display);font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.homey .hitem > div > span{font-size:13.5px;color:var(--muted);display:block}
.homey .hitem .hmeta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--muted)}
.homey .hitem .hmeta span{display:inline}
.homey .hitem .hnew{margin-top:4px;font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.homey .hitem .mono{overflow-wrap:anywhere}
.homey .pill{font-size:11px;padding:2px 8px}

.notice{padding:20px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
footer{padding-block:48px 40px;color:var(--muted);font-size:14px}
footer .bar{border-top:1px solid var(--line);padding-top:22px}
footer nav{display:flex;gap:18px}

/* Promo-banner, zoals de grote kaarten in de App Store */
.promo-wrap{margin-bottom:18px}
.promo-rail{display:grid;grid-auto-flow:column;grid-auto-columns:100%;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:24px}
.promo-rail::-webkit-scrollbar{display:none}
.promo-rail.multi{grid-auto-columns:min(100%,880px)}
.promo{position:relative;isolation:isolate;border-radius:24px;overflow:hidden;aspect-ratio:16/8;min-height:300px;max-height:460px;max-width:100%;scroll-snap-align:start;background:#121726;color:#fff}
.promo .bg{position:absolute;inset:0;z-index:-2}
.promo .bg img{width:100%;height:100%;object-fit:cover;display:block}
.promo .bg.fromicon img{transform:scale(1.7);filter:blur(42px) saturate(1.5)}
.promo::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,0) 38%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
.promo .head{position:absolute;top:0;left:0;right:0;padding:24px 26px;display:flex;flex-direction:column;gap:6px;max-width:640px}
.promo .head .eyebrow{color:rgba(255,255,255,.82)}
.promo .head h3{font-size:clamp(28px,4.2vw,46px);line-height:1.02;font-weight:800;letter-spacing:-.03em;color:#fff}
.promo .head p{margin:4px 0 0;font-size:16px;color:rgba(255,255,255,.88);max-width:46ch}
.promo .bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:14px 18px;background:rgba(18,23,38,.38);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.promo .bar .icon{width:48px;height:48px;border-radius:11px;font-size:16px;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.promo .bar .txt{flex:1;min-width:0}
.promo .bar b{display:block;font-family:var(--f-display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.promo .bar span{display:block;font-size:13px;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.promo .get{flex:none;font:700 14px var(--f-body);padding:8px 18px;border-radius:99px;background:#fff;color:#0B57D0;text-decoration:none}
.promo .get:hover{background:#EEF2FF}
/* Banner met eigen ontwerp: volledig beeld op elk scherm, geen tekst eroverheen, balk eronder */
.promo.has-img{aspect-ratio:auto;min-height:0;max-height:none;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.promo.has-img::after{display:none}
.promo.has-img .bg{position:static;z-index:auto;aspect-ratio:16/9;background:#121726}
.promo.has-img .bg img{object-fit:cover}
.promo.has-img .bar{position:static;background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none;padding:12px 16px}
.promo.has-img .bar .icon{box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.promo.has-img .bar span{color:var(--muted)}
.promo.has-img .get{background:var(--accent);color:var(--on-accent)}
.promo.has-img .get:hover{background:var(--accent);opacity:.9}
.promo-dots{display:flex;justify-content:center;gap:8px;margin-top:12px}
.promo-dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.promo-dots button[aria-current="true"]{background:var(--ink)}

@media (max-width:860px){
  .intro{grid-template-columns:1fr;gap:16px;padding-block:32px 24px}
  .detail{grid-template-columns:1fr}
  .homey ul{grid-template-columns:repeat(2,minmax(0,1fr))}
  .homey-intro{grid-template-columns:minmax(0,1fr)}
  .homey-intro > .icon{grid-row:auto}
  .homey-intro .btns{grid-column:auto;grid-row:auto;justify-content:flex-start}
  .hd-flow{grid-template-columns:1fr}
}
@media (max-width:600px){
  .promo:not(.has-img){aspect-ratio:4/5;max-height:none;min-height:0}
  .promo.has-img{border-radius:18px}
  .promo.has-img .bar{padding:10px 12px;gap:10px}
  .promo.has-img .bar .icon{width:40px;height:40px;border-radius:9px}
  .promo .head{padding:20px}
}
@media (max-width:480px){
  .homey{padding:20px;border-radius:20px}
  .lab-card,.detail{padding:18px}
  .homey ul{grid-template-columns:1fr}
  .homey li.hdetail{padding:18px 14px}
  .hd-head{grid-template-columns:56px minmax(0,1fr) auto;gap:12px}
  .hd-head .icon{width:56px;height:56px}
  .hd-head h3{font-size:20px}
  .hd-head .btns{grid-column:1/-1}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .right nav{display:none}
}
</style>

<script>
const T = {
  nl:{ navNew:"Nieuw", navApps:"iOS-apps",

    navTf:"TestFlight", tfTitle:"Via TestFlight", tfSub:"Nog niet in de App Store, maar je kunt ze nu al testen via TestFlight.",
    all:"Alles", homeyTitle:"Apps voor je smart home",
    homeySub:"Koppelingen met diensten die je dagelijks gebruikt, verdeeld over twee ontwikkelaarsaccounts. Versies en releasenotes vind je in de Homey App Store en op het Community Forum.",
    homeyStore:"Léon van der Linden", h_beta:"Test", h_dev:"In ontwikkeling",
    donate:"Doneren", live:"Nieuw in de App Store", beta:"Open beta", dev:"In ontwikkeling",
    appstore:"Gratis in de App Store", testflight:"Doe mee via TestFlight", website:"Website",
    getStore:"Downloaden", getBeta:"Probeer beta", getSite:"Bekijk", whatsNew:"Nieuw",
    hDevices:"Apparaten", hWidgets:"Widgets", hFlow:"Flow-kaarten", hWhen:"Als…", hAnd:"En…", hThen:"Dan…",
    hWorks:"Werkt op", hStore:"Bekijk in de Homey App Store", hSupport:"Ondersteuning", hSite:"Website",
    hAll:"Toon alle {n}", hLess:"Toon minder", hClose:"Sluiten", hNews:"Wat is nieuw", hOpen:"Details van {n}",
    rating:"Beoordeling", reviews:"Reviews", age:"Leeftijd", category:"Categorie", language:"Taal", size:"Grootte",
    history:"Versiegeschiedenis", noRating:"Nog geen beoordeling", dev_by:"Léon van der Linden",
    loadError:"De apps konden niet worden geladen. Controleer of apps.json naast index.html staat.",
    cats:{utilities:"Hulpmiddelen",entertainment:"Amusement",news:"Nieuws",business:"Zakelijk",lifestyle:"Lifestyle",games:"Games",music:"Muziek",productivity:"Productiviteit",health:"Gezondheid",education:"Onderwijs",travel:"Reizen",weather:"Weer",sports:"Sport",photo:"Foto en video",navigation:"Navigatie",finance:"Financiën",reference:"Naslag",social:"Sociaal",food:"Eten en drinken",books:"Boeken",developer:"Ontwikkelaarstools",design:"Grafisch en ontwerp",shopping:"Winkelen",kids:"Kinderen"}},
  en:{ navNew:"New", navApps:"iOS apps",
    h1:"Apps for your neighbourhood, your home and <em>your day</em>.",
    intro:"I build apps for local initiatives and handy tools, plus Homey apps that make your smart home smarter. All free.",
    stLive:"apps live", stDev:"in beta or development", stHomey:"Homey apps",
    newTitle:"New and upcoming", newSub:"Just released, in beta or still on the workbench.",
    storeTitle:"On the App Store", storeSub:"Tap an app for details and version history.",
    navTf:"TestFlight", tfTitle:"On TestFlight", tfSub:"Not on the App Store yet, but you can already test them via TestFlight.",
    all:"All", homeyTitle:"Apps for your smart home",
    homeySub:"Integrations with services you use every day, spread across two developer accounts. Versions and release notes are in the Homey App Store and on the Community Forum.",
    homeyStore:"Léon van der Linden", h_beta:"Test", h_dev:"In development",
    donate:"Donate", live:"New on the App Store", beta:"Open beta", dev:"In development",
    appstore:"Free on the App Store", testflight:"Join on TestFlight", website:"Website",
    getStore:"Get", getBeta:"Try beta", getSite:"View", whatsNew:"New",
    hDevices:"Devices", hWidgets:"Widgets", hFlow:"Flow cards", hWhen:"When…", hAnd:"And…", hThen:"Then…",
    hWorks:"Works on", hStore:"View in the Homey App Store", hSupport:"Support", hSite:"Website",
    hAll:"Show all {n}", hLess:"Show less", hClose:"Close", hNews:"What's new", hOpen:"Details of {n}",
    rating:"Rating", reviews:"Reviews", age:"Age", category:"Category", language:"Language", size:"Size",
    history:"Version history", noRating:"No ratings yet", dev_by:"Léon van der Linden",
    loadError:"The apps could not be loaded. Check that apps.json sits next to index.html.",
    cats:{utilities:"Utilities",entertainment:"Entertainment",news:"News",business:"Business",lifestyle:"Lifestyle",games:"Games",music:"Music",productivity:"Productivity",health:"Health",education:"Education",travel:"Travel",weather:"Weather",sports:"Sports",photo:"Photo & Video",navigation:"Navigation",finance:"Finance",reference:"Reference",social:"Social",food:"Food & Drink",books:"Books",developer:"Developer Tools",design:"Graphics & Design",shopping:"Shopping",kids:"Kids"}}
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let APPS = [], lang = "nl", cat = "all", open = null;

try { lang = localStorage.getItem("lr-lang") || (navigator.language||"nl").slice(0,2); } catch(e){}
if (location.hash === "#en") lang = "en";
if (!T[lang]) lang = "nl";

const t = k => T[lang][k];
const L = v => v == null ? "" : (typeof v === "string" ? v : (v[lang] ?? v.nl ?? v.en ?? ""));
const catName = c => T[lang].cats[c] || c;
const num = n => n.toFixed(1).replace(".", lang==="nl" ? "," : ".");
function date(d){
  if (!d || d.length === 4) return d || "";
  const x = new Date(d + "T12:00:00");
  return isNaN(x) ? d : new Intl.DateTimeFormat(lang==="nl"?"nl-NL":"en-GB",{day:"numeric",month:"short",year:"numeric"}).format(x);
}
function icon(a, cls=""){
  const init = esc(a.name.replace(/[^A-Za-z0-9]/g,"").slice(0,2));
  return `<span class="icon ${cls}" aria-hidden="true">${init}${a.icon?`<img src="${esc(a.icon)}" alt="" onerror="this.remove()">`:""}</span>`;
}
function ctas(a, max=9){
  const l = a.links || {}, out = [];
  if (l.appstore)   out.push([l.appstore, t("appstore")]);
  if (l.testflight) out.push([l.testflight, t("testflight")]);
  if (l.website)    out.push([l.website, t("website")]);
  return out.slice(0,max).map(([u,label],i)=>`<a class="btn ${i===0?"primary":""}" href="${esc(u)}" target="_blank" rel="noopener">${esc(label)}</a>`).join("");
}

function renderStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = t(el.dataset.t); if (v == null) return;
    if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
  });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("#filters").setAttribute("aria-label", lang==="nl" ? "Filter op categorie" : "Filter by category");
}

function render(){
  renderStatic();
  if (!APPS.length) return;
  const ios = APPS.filter(a => a.section === "ios");
  const live = ios.filter(a => a.status === "live");
  const homey = APPS.filter(a => a.section === "homey");
  $("#stLive").textContent = live.length;
  $("#stDev").textContent = ios.filter(a => a.status !== "live").length;
  $("#stHomey").textContent = homey.length;

  // Promo-banners
  const promos = ios.filter(a => a.promo && a.promo.show);
  $("#promoWrap").hidden = !promos.length;
  $("#promo").classList.toggle("multi", promos.length > 1);
  $("#promo").innerHTML = promos.map(a => {
    const p = a.promo, l = a.links || {};
    const [url, label] = l.appstore ? [l.appstore, t("getStore")] : l.testflight ? [l.testflight, t("getBeta")] : l.website ? [l.website, t("getSite")] : [null, null];
    const img = typeof p.image === "string" ? p.image : L(p.image);
    const bg = img ? `<div class="bg"><img src="${esc(img)}" alt="" width="1600" height="900"></div>`
                       : (a.icon ? `<div class="bg fromicon"><img src="${esc(a.icon)}" alt=""></div>` : `<div class="bg"></div>`);
    const title = L(p.title) || a.name;
    return `<article class="promo${img ? " has-img" : ""}" aria-label="${esc(img ? (title + (L(p.text) ? ". " + L(p.text) : "")) : a.name)}">
      ${bg}
      ${img ? "" : `<div class="head">
        <span class="eyebrow">${esc(L(p.eyebrow) || t(a.status))}</span>
        <h3>${esc(title)}</h3>
        ${L(p.text) ? `<p>${esc(L(p.text))}</p>` : ""}
      </div>`}
      <div class="bar">
        ${icon(a)}
        <div class="txt"><b>${esc(a.name)}</b><span>${esc(L(a.subtitle) || catName(a.category))}</span></div>
        ${url ? `<a class="get" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>` : ""}
      </div>
    </article>`;
  }).join("");
  $("#promoDots").innerHTML = promos.length > 1 ? promos.map((a,i) => `<button type="button" data-promo="${i}" aria-label="${esc(a.name)}" aria-current="${i===0}"></button>`).join("") : "";
  startPromoTimer();

  // Uitgelicht: featured, of alles wat nog niet live is
  // Alleen apps die in beheer zijn aangevinkt bij "Tonen in Nieuw en onderweg"
  const feat = ios.filter(a => a.featured === true);
  $("#nieuw").hidden = !feat.length;
  $("#lab").innerHTML = feat.map(a => `
    <article class="lab-card">
      <span class="pill ${a.status}">${esc(t(a.status))}</span>
      <div class="lab-top">${icon(a,"lg")}<div><h3>${esc(a.name)}</h3>${a.subtitle?`<div class="eyebrow" style="margin-top:2px">${esc(L(a.subtitle))}</div>`:""}</div></div>
      <p>${esc(L(a.description))}</p>
      <div class="plat">${(a.platforms||[]).map(p=>`<span class="tag">${esc(p)}</span>`).join("")}</div>
      ${ctas(a,1)}
    </article>`).join("");

  const cats = ["all", ...new Set(live.map(a => a.category))];
  if (!cats.includes(cat)) cat = "all";
  $("#filters").innerHTML = cats.map(c => {
    const n = c==="all" ? live.length : live.filter(a=>a.category===c).length;
    return `<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${c===cat}">${esc(c==="all"?t("all"):catName(c))}<span class="n">${n}</span></button>`;
  }).join("");

  renderGrid($("#grid"), "detailSlot", live.filter(a => cat==="all" || a.category===cat));

  // TestFlight: wel een TestFlight-link, nog geen App Store-link
  const tf = ios.filter(a => a.links && a.links.testflight && !a.links.appstore);
  $("#testflight").hidden = !tf.length;
  $("#navTf").hidden = !tf.length;
  renderGrid($("#tfGrid"), "tfSlot", tf);

  renderHomey();
}

function renderGrid(gridEl, slotId, list){
  gridEl.innerHTML = list.map(a => `
    <button class="app" type="button" data-id="${esc(a.id)}" aria-expanded="${open===a.id}" aria-controls="${slotId}">
      ${icon(a)}
      <div style="min-width:0">
        <h3>${esc(a.name)}</h3>
        <div class="cat">${esc(catName(a.category))}${a.badge?` · ${esc(L(a.badge))}`:""}</div>
        <div class="meta"><span>${!(a.links&&a.links.appstore)?esc(t(a.status)):a.rating?`<span class="stars" aria-hidden="true">★★★★★</span> ${num(a.rating)}`:esc(t("noRating"))}</span>${a.history&&a.history.length?`<span class="mono">v${esc(a.history[0].version)}</span>`:""}</div>
      </div>
    </button>`).join("");

  const a = list.find(x => x.id === open);
  $("#"+slotId).innerHTML = !a ? "" : `
    <div class="detail ${a.history&&a.history.length?"":"single"}">
      <div>
        <div class="lead">${icon(a,"lg")}<div><h3>${esc(a.name)}</h3><div style="color:var(--muted);font-size:14px">${esc(t("dev_by"))}</div></div></div>
        <p>${esc(L(a.description))}</p>
        <div class="plat">${(a.platforms||[]).map(p=>`<span class="tag">${esc(p)}</span>`).join("")}</div>
        <dl class="facts">
          ${a.links&&a.links.appstore?`<div><dt>${esc(t("rating"))}</dt><dd>${a.rating?num(a.rating)+" ★":"–"}</dd></div>
          <div><dt>${esc(t("reviews"))}</dt><dd>${a.reviews||0}</dd></div>`:""}
          <div><dt>${esc(t("age"))}</dt><dd>4+</dd></div>
          <div><dt>${esc(t("category"))}</dt><dd>${esc(catName(a.category))}</dd></div>
          <div><dt>${esc(t("language"))}</dt><dd>${esc(a.languages||"–")}</dd></div>
          <div><dt>${esc(t("size"))}</dt><dd>${esc(a.size||"–")}</dd></div>
        </dl>
        <div class="btns">${ctas(a)}</div>
      </div>
      ${a.history&&a.history.length?`<div class="history"><h4>${esc(t("history"))}</h4><ol>${a.history.map(h=>`<li><div><div class="mono">${esc(h.version)}</div><div class="d">${esc(date(h.date))}</div></div><p>${esc(L(h.notes))}</p></li>`).join("")}</ol></div>`:""}
    </div>`;

}

// ---------- Homey: lijst met uitklapbare details ----------
let openHomey = null;
const flowTitle = txt => String(txt || "")
  .replace(/!\{\{([^|}]*)\|[^}]*\}\}/g, "$1")   // !{{is|isn't}} -> is
  .replace(/\[\[[^\]]*\]\]/g, "…")                // [[argument]] -> …
  .replace(/\{\{[^}]*\}\}/g, "…");
const homeyUrl = h => (h.links && h.links.homey ? h.links.homey : "").replace("/nl-nl/", lang==="nl" ? "/nl-nl/" : "/en-us/");

function homeyDetail(h){
  const x = h.homey || {}, last = (h.history || [])[0];
  const plat = (x.platforms || []).map(p => p === "local" ? "Homey Pro" : p === "cloud" ? "Homey Cloud" : p);
  const facts = [
    plat.length ? `<span class="tag">${esc(t("hWorks"))}: ${esc(plat.join(", "))}</span>` : "",
    x.compatibility ? `<span class="tag">Homey ${esc(x.compatibility.replace(/^>=\s*/, "v").replace(/^v?(\d)/, "v$1"))}+</span>` : "",
  ].join("");
  const btns = [
    homeyUrl(h) ? `<a class="btn primary" href="${esc(homeyUrl(h))}" target="_blank" rel="noopener">${esc(t("hStore"))}</a>` : "",
    x.homepage ? `<a class="btn" href="${esc(x.homepage)}" target="_blank" rel="noopener">${esc(t("hSite"))}</a>` : "",
    x.support ? `<a class="btn" href="${esc(x.support)}" target="_blank" rel="noopener">${esc(t("hSupport"))}</a>` : "",
  ].join("");
  const drivers = (x.drivers || []).map(d => `
    <div class="hd-driver">
      ${d.image ? `<span class="img"><img src="${esc(d.image)}" alt="" loading="lazy"></span>`
                : `<span class="img ic" style="--hc:${esc(x.color || "#2747E8")}">${d.icon ? `<img src="${esc(d.icon)}" alt="" loading="lazy">` : ""}</span>`}
      <span>${esc(L(d.name))}</span>
    </div>`).join("");
  const widgets = (x.widgets || []).map(w => `
    <figure class="hd-widget">
      ${w.light ? `<img class="wl" src="${esc(w.light)}" alt="" loading="lazy">` : ""}
      ${w.dark || w.light ? `<img class="wd" src="${esc(w.dark || w.light)}" alt="" loading="lazy">` : ""}
      <figcaption>${esc(L(w.name))}</figcaption>
    </figure>`).join("");
  const SHOW = 6;
  const col = (cls, key, cards) => !cards || !cards.length ? "" : `
    <div class="hd-col ${cls}">
      <h5>${esc(t(key))} <small style="font-weight:500;color:var(--muted);letter-spacing:0;text-transform:none">${cards.length}</small></h5>
      <ol>${cards.map((c,i) => `<li class="${i >= SHOW ? "more" : ""}">${esc(flowTitle(L(c.title)))}</li>`).join("")}</ol>
      ${cards.length > SHOW ? `<button type="button" class="showall" data-n="${cards.length}">${esc(t("hAll").replace("{n}", cards.length))}</button>` : ""}
    </div>`;
  const f = x.flow || {};
  const nFlow = ["triggers","conditions","actions"].reduce((n,k) => n + ((f[k] || []).length), 0);
  const news = (h.history || []).slice(0, 3).filter(e => L(e.notes)).map(e => `
    <div><span><span class="v">v${esc(e.version)}</span><br><span class="d">${esc(date(e.date))}</span></span><p>${esc(L(e.notes))}</p></div>`).join("");
  return `
    <div class="hd-head">
      ${icon(h, "lg")}
      <div style="min-width:0">
        <h3>${esc(h.name)}${h.status!=="live"?` <span class="pill ${h.status}">${esc(t("h_"+h.status))}</span>`:""}</h3>
        <div class="sub">${last && last.version ? `<span class="mono">v${esc(last.version)}</span>` : ""}${h.rating ? `<span><span class="stars" aria-hidden="true">★</span> ${num(h.rating)}</span>` : ""}</div>
      </div>
      <button type="button" class="hd-close" data-hclose aria-label="${esc(t("hClose"))}">×</button>
      <div class="btns" style="grid-column:1/-1">${btns}</div>
    </div>
    ${L(h.description) ? `<p class="hd-desc">${esc(L(h.description))}</p>` : ""}
    ${facts ? `<div class="hd-facts">${facts}</div>` : ""}
    ${drivers ? `<section class="hd-sec"><h4>${esc(t("hDevices"))} <small>${(x.drivers||[]).length}</small></h4><div class="hd-drivers">${drivers}</div></section>` : ""}
    ${widgets ? `<section class="hd-sec"><h4>${esc(t("hWidgets"))} <small>${(x.widgets||[]).length}</small></h4><div class="hd-widgets">${widgets}</div></section>` : ""}
    ${nFlow ? `<section class="hd-sec"><h4>${esc(t("hFlow"))} <small>${nFlow}</small></h4><div class="hd-flow">${col("when","hWhen",f.triggers)}${col("and","hAnd",f.conditions)}${col("then","hThen",f.actions)}</div></section>` : ""}
    ${news ? `<section class="hd-sec"><h4>${esc(t("hNews"))}</h4><div class="hd-news">${news}</div></section>` : ""}`;
}

function renderHomey(){
  const homey = APPS.filter(a => a.section === "homey");
  if (openHomey && !homey.some(h => h.id === openHomey)) openHomey = null;
  $("#homeyList").innerHTML = homey.map(h => {
    const last = (h.history || [])[0];
    const meta = [last && last.version ? `<span class="mono">v${esc(last.version)}</span>` : "",
                  h.rating ? `<span><span class="stars" aria-hidden="true">★</span> ${num(h.rating)}</span>` : ""].filter(Boolean).join("");
    const news = last && L(last.notes) ? `<span class="hnew">${esc(t("whatsNew"))}: ${esc(L(last.notes).split("\n")[0])}</span>` : "";
    return `<li><button type="button" class="hitem" data-hid="${esc(h.id)}" aria-expanded="${openHomey===h.id}" aria-label="${esc(t("hOpen").replace("{n}", h.name))}">
      ${icon(h)}<div style="min-width:0"><b>${esc(h.name)}${h.status!=="live"?` <span class="pill ${h.status}">${esc(t("h_"+h.status))}</span>`:""}</b><span>${esc(L(h.description))}</span>${meta?`<span class="hmeta">${meta}</span>`:""}${news}</div>
      <span class="chev" aria-hidden="true"></span></button></li>`;
  }).join("");
  placeHomeyDetail();
}

// Het detailpaneel komt onder de rij van de aangeklikte app, over de volle breedte.
function placeHomeyDetail(){
  const ul = $("#homeyList"); ul.querySelector(".hdetail")?.remove();
  if (!openHomey) return;
  const h = APPS.find(a => a.id === openHomey); if (!h) return;
  const items = [...ul.querySelectorAll(":scope > li")];
  const idx = items.findIndex(li => li.querySelector(`[data-hid="${CSS.escape(openHomey)}"]`));
  const cols = getComputedStyle(ul).gridTemplateColumns.split(" ").filter(Boolean).length || 1;
  const rowEnd = Math.min(items.length - 1, Math.floor(idx / cols) * cols + cols - 1);
  const li = document.createElement("li"); li.className = "hdetail"; li.id = "homeyDetail";
  li.innerHTML = homeyDetail(h);
  items[rowEnd].after(li);
}
let lastCols = 0;
window.addEventListener("resize", () => {
  const cols = getComputedStyle($("#homeyList")).gridTemplateColumns.split(" ").length;
  if (cols !== lastCols) { lastCols = cols; placeHomeyDetail(); }
}, {passive:true});

// Promo-banners: elke 8 seconden automatisch naar de volgende.
// Pauzeert bij muis erop, toetsenbordfocus, aanraken en als de pagina niet zichtbaar is.
const PROMO_MS = 8000;
let promoTimer = null, promoPaused = false;
function promoIndex(){
  const r = $("#promo"), cards = [...r.children]; if (!cards.length) return 0;
  return Math.min(cards.length - 1, Math.round(r.scrollLeft / (cards[0].offsetWidth + 16)));
}
function goPromo(i){
  const r = $("#promo"), c = r.children[i]; if (!c) return;
  r.scrollTo({ left: c.offsetLeft - r.offsetLeft, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
function startPromoTimer(){
  clearInterval(promoTimer); promoTimer = null;
  if ($("#promo").children.length < 2) return;
  promoTimer = setInterval(() => {
    if (promoPaused || document.hidden) return;
    const n = $("#promo").children.length;
    goPromo((promoIndex() + 1) % n);
  }, PROMO_MS);
}
["mouseenter","focusin","touchstart"].forEach(ev => $("#promo").addEventListener(ev, () => { promoPaused = true; }, {passive:true}));
["mouseleave","focusout"].forEach(ev => $("#promo").addEventListener(ev, () => { promoPaused = false; startPromoTimer(); }));
$("#promo").addEventListener("touchend", () => { promoPaused = false; startPromoTimer(); }, {passive:true});

$("#promo").addEventListener("scroll", () => {
  if ($("#promo").children.length < 2) return;
  const i = promoIndex();
  document.querySelectorAll("#promoDots button").forEach((b,j) => b.setAttribute("aria-current", j===i));
}, {passive:true});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && openHomey) document.querySelector("[data-hclose]")?.click();
});

document.addEventListener("click", e => {
  const pd = e.target.closest("[data-promo]");
  if (pd){ goPromo(+pd.dataset.promo); startPromoTimer(); return; }
  const lb = e.target.closest(".lang button");
  if (lb){ lang = lb.dataset.lang; try{localStorage.setItem("lr-lang",lang)}catch(_){} render(); return; }
  const ch = e.target.closest(".chip");
  if (ch){ cat = ch.dataset.cat; render(); return; }
  const hi = e.target.closest(".hitem");
  if (hi){
    openHomey = openHomey === hi.dataset.hid ? null : hi.dataset.hid;
    document.querySelectorAll(".hitem").forEach(b => b.setAttribute("aria-expanded", b.dataset.hid === openHomey));
    placeHomeyDetail();
    if (openHomey) $("#homeyDetail")?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"nearest"});
    return;
  }
  if (e.target.closest("[data-hclose]")){
    const was = openHomey; openHomey = null;
    document.querySelectorAll(".hitem").forEach(b => b.setAttribute("aria-expanded", "false"));
    placeHomeyDetail();
    document.querySelector(`.hitem[data-hid="${CSS.escape(was)}"]`)?.focus();
    return;
  }
  const sa = e.target.closest(".showall");
  if (sa){
    const c = sa.closest(".hd-col"); c.classList.toggle("open");
    sa.textContent = c.classList.contains("open") ? t("hLess") : t("hAll").replace("{n}", sa.dataset.n);
    return;
  }
  const ap = e.target.closest(".app");
  if (ap){ open = open===ap.dataset.id ? null : ap.dataset.id; render();
    if (open) document.getElementById(ap.getAttribute("aria-controls"))?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"nearest"}); }
});

renderStatic();
fetch("apps.json", {cache:"no-cache"})
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { APPS = d.apps || []; open = (APPS.find(a=>a.section==="ios"&&a.status==="live"&&!a.featured)||{}).id || null; render(); })
  .catch(() => { $("#grid").innerHTML = `<div class="notice">${esc(t("loadError"))}</div>`; });
</script>
