<style>
/* Hallmark · checked: 2026-11-13 · genre: editorial (inferred)
 * floor: 0 FAIL · fixed: 34, 48, 7a, 19, 54, 63, 67, 38iii, 64, 26b, 29, 40, F15
 * built: the project · redesign: polish · v2.0.0 */
/* Layout: één kolom — intro, uitgelichte nieuwkomers, filterbare iOS-grid, Homey-sectie. Alle inhoud komt uit apps.json. */
:root{
  --bg:#F3F5F9;--surface:#FFFFFF;--ink:#121726;--muted:#5D6578;--line:#DDE2EC;
  --accent:#2747E8;--accent-soft:#E6EBFF;--build:#B4530D;--build-soft:#FFF0E3;
  --beta:#0F766E;--beta-soft:#E0F4F1;--star:#E3A008;--on-accent:#FFFFFF;
  --paper:#FBFCFF;--ring:rgb(18 23 38 / .08);--stage:#121726;--on-stage:#FBFCFF;
  --on-stage-2:rgb(251 252 255 / .86);--on-stage-3:rgb(251 252 255 / .74);--stage-bar:#1B2132;
  --scrim-top:rgb(9 12 20 / .42);--scrim-bottom:rgb(9 12 20 / .55);--scrim-clear:rgb(9 12 20 / 0);
  --on-stage-ring:rgb(251 252 255 / .18);--get-ink:#0B57D0;--get-hover:#EEF2FF;
  --flow-when:#E8A317;--flow-and:#2F80ED;--flow-then:#22A06B;--driver-bg:#2747E8;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hd-widget .wl{display:none}:root:not([data-theme="light"]) .hd-widget .wd{display:block}}
:root[data-theme="dark"] .hd-widget .wl{display:none}
:root[data-theme="dark"] .hd-widget .wd{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1018;--surface:#161B27;--ink:#E9ECF4;--muted:#98A0B3;--line:#262D3D;
  --accent:#8A9DFF;--accent-soft:#1D2547;--build:#F2A15E;--build-soft:#2E2016;
  --beta:#5EC8B8;--beta-soft:#13302C;--star:#F5C04A;--on-accent:#0D1018;--ring:rgb(233 236 244 / .1);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1018;--surface:#161B27;--ink:#E9ECF4;--muted:#98A0B3;--line:#262D3D;
  --accent:#8A9DFF;--accent-soft:#1D2547;--build:#F2A15E;--build-soft:#2E2016;
  --beta:#5EC8B8;--beta-soft:#13302C;--star:#F5C04A;--on-accent:#0D1018;--ring:rgb(233 236 244 / .1);color-scheme:dark}

*{box-sizing:border-box}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;overflow-wrap:break-word;min-width:0}
.mono{font-family:var(--f-mono);font-size:12.5px}
.eyebrow{font-size:14px;font-weight:500;color:var(--muted)}

header.top{padding-block:24px 8px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-family:var(--f-display);font-weight:700;font-size:18px}
.brand svg{width:36px;height:36px;display:block}
.right{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.right nav{display:flex;gap:20px;font-size:14.5px;color:var(--muted)}
.right nav a{text-decoration:none}
.right nav a:hover{color:var(--ink)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:4px;background:var(--surface)}
.lang button{font:600 12.5px var(--f-body);border:0;background:none;color:var(--muted);padding:4px 12px;border-radius:99px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.intro{padding-block:52px 36px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;align-items:end}
.intro h1{font-size:clamp(40px,6.4vw,76px);line-height:.98;font-weight:800;letter-spacing:-.035em}
.intro h1 em{font-style:normal}
.intro p{color:var(--muted);max-width:44ch;margin:0 0 8px}
.stats{display:flex;gap:32px;margin-top:24px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{font-size:13px;color:var(--muted)}

.section{padding-block:40px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-head h2{font-size:clamp(24px,3vw,32px);font-weight:700;letter-spacing:-.02em}
.sec-head p{margin:0;color:var(--muted);font-size:14.5px}

.lab{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}
.lab-card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.lab-card h3{font-size:24px;font-weight:700;letter-spacing:-.02em}
.lab-card p{margin:0;color:var(--muted);font-size:15px}
.lab-card .plat{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.lab-card .btn{align-self:flex-start}
.lab-top{display:flex;align-items:center;gap:16px}

.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;padding:4px 12px;border-radius:99px;background:var(--build-soft);color:var(--build)}
.pill.live{background:var(--accent-soft);color:var(--accent)}
.pill.beta{background:var(--beta-soft);color:var(--beta)}
.tag{font-size:12px;padding:4px 8px;border-radius:7px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.ostag{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 8px;color:var(--ink)}
.ostag svg{width:16px;height:16px;flex:none;color:var(--ink)}

.icon{width:60px;height:60px;border-radius:14px;flex:none;position:relative;overflow:hidden;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--bg);background:var(--ink);box-shadow:inset 0 0 0 1px var(--ring)}
.icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.icon.lg{width:72px;height:72px;border-radius:17px;font-size:26px}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chip{font:500 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:99px;cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-size:12px;opacity:.6;margin-left:4px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.app{text-decoration:none;display:grid;grid-template-columns:60px minmax(0,1fr);gap:16px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.app:hover{border-color:var(--muted)}
.app[aria-expanded="true"]{border-color:var(--accent)}
.app h3{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.app .cat{font-size:13px;color:var(--muted)}
.app .meta{display:flex;gap:12px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.stars{color:var(--star);letter-spacing:1px}

.detail{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px}
.detail.single{grid-template-columns:minmax(0,1fr)}
.detail h3{font-size:28px;font-weight:700;letter-spacing:-.02em}
.detail .lead{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.detail p{margin:0 0 16px;color:var(--muted);max-width:60ch}
.detail .plat{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 16px}
.facts div{background:var(--surface);padding:12px 12px}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 14.5px var(--f-body);padding:12px 20px;border-radius:99px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.history h4{font-family:var(--f-display);font-size:16px;margin:0 0 12px}
.history ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.history li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;font-size:14px}
.history .d{color:var(--muted);font-size:12px}
.history li p{margin:0;color:var(--muted)}
.history li.more{display:none}
.history.open li.more{display:grid}
.history .showall{margin-top:12px;font:600 13px var(--f-body);background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0}
.lablink{color:inherit;text-decoration:none}
.lablink:hover{text-decoration:underline;text-underline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Ingedrukt en uitgeschakeld, voor alle knoppen */
.btn,.chip,.app,.promo .get,.lang button,.search .clear,.history .showall,.hd-col .showall,.hd-close,.promo-dots button{transition:transform .12s ease-out}
.btn:active,.chip:active,.promo .get:active,.lang button:active,.search .clear:active,.hd-close:active{transform:scale(.97)}
.app:active{transform:scale(.99)}
.history .showall:active,.hd-col .showall:active{transform:translateY(1px)}
button:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;transform:none}
@media (prefers-reduced-motion:reduce){.btn,.chip,.app,.promo .get,.lang button,.search .clear,.history .showall,.hd-col .showall,.hd-close,.promo-dots button{transition:none}}
/* Zoeken */
.search{padding-bottom:8px}
.search label{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 8px 0 16px;transition:border-color .15s,box-shadow .15s}
.search label:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:500 16px var(--f-body);padding:16px 0;outline:none}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{border:0;background:var(--bg);color:var(--muted);font:600 13px var(--f-body);padding:8px 12px;border-radius:99px;cursor:pointer}
.search-empty{padding:28px 0 8px;color:var(--muted)}
/* Over mij */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:40px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px}
.about h2{font-size:clamp(24px,3vw,32px);font-weight:700;letter-spacing:-.02em}
.about p{margin:0 0 20px;color:var(--muted);font-size:16px;max-width:62ch}
.about .links{display:flex;gap:12px;flex-wrap:wrap}
@media (max-width:760px){.about{grid-template-columns:minmax(0,1fr);gap:12px;padding:24px}}
/* Footer */
.fcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;padding-bottom:28px}
.fcols h3{font:600 14px var(--f-body);color:var(--muted);margin:0 0 12px}
.fcols ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.fcols a{color:var(--ink);text-decoration:none;font-size:14.5px}
.fcols a:hover{text-decoration:underline;text-underline-offset:3px}
@media (max-width:640px){.fcols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}


/* Homey: zelfde kaarten als de App Store-grid, details klappen open onder de rij */
.hitem h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hitem h3 .pill{font-size:11px;padding:2px 8px}
.vtag{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.vtag.test{color:var(--beta)}
.testbtn:not(.primary){border-color:var(--beta);color:var(--beta)}
.testbtn .mono{font-size:12px;opacity:.8}
.homey-more{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;margin-top:20px;font-size:14px;color:var(--muted)}
.homey-more a{color:var(--ink);font-weight:600;text-underline-offset:3px}
/* Uitgeklapte Homey-app, zoals in de Homey App Store */
.hdetail{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;min-width:0}
.hd-head{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:center;margin-bottom:20px}
.hd-head h3{font-size:24px;letter-spacing:-.02em;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hd-head .sub{font-size:14px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.hd-close{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:18px;line-height:1}
.hd-desc{color:var(--muted);margin:0 0 16px;max-width:70ch}
.hd-facts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.hd-sec{margin-top:24px}
.hd-sec h4{font-family:var(--f-display);font-size:17px;margin:0 0 12px;display:flex;align-items:baseline;gap:8px}
.hd-sec h4 small{font:500 13px var(--f-body);color:var(--muted)}
.hd-drivers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.hd-driver{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;font-weight:600;font-size:14px;min-width:0}
.hd-driver .img{width:84px;height:84px;border-radius:16px;background:var(--paper);display:grid;place-items:center;overflow:hidden}
.hd-driver .img img{width:100%;height:100%;object-fit:contain}
.hd-driver .img.ic{background:var(--hc,var(--driver-bg))}
.hd-driver .img.ic img{width:56%;height:56%;filter:brightness(0) invert(1)}
.hd-widgets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.hd-widget{margin:0;min-width:0}
.hd-widget img{width:100%;height:auto;min-height:96px;object-fit:contain;border-radius:14px;border:1px solid var(--line);background:var(--bg);display:block}
.hd-widget figcaption{font-size:14px;font-weight:600;margin-top:8px}
.hd-widget .wd{display:none}
.hd-flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.hd-col{min-width:0}
.hd-col h5{margin:0 0 8px;font:700 14px var(--f-body);display:flex;align-items:center;gap:8px}
.hd-col h5::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--fc)}
.hd-col.when{--fc:var(--flow-when)}.hd-col.and{--fc:var(--flow-and)}.hd-col.then{--fc:var(--flow-then)}
.hd-col ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hd-col li{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;background:var(--bg);color:var(--ink);min-width:0;overflow-wrap:anywhere}
.hd-col li.more{display:none}
.hd-col.open li.more{display:block}
.hd-col .showall{margin-top:8px;font:600 13px var(--f-body);background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0}
.hd-news{display:flex;flex-direction:column;gap:12px}
.hd-news > div{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px;font-size:14px}
.hd-news .v{font-family:var(--f-mono);font-size:12.5px}
.hd-news .d{color:var(--muted);font-size:12px}
.hd-news p{margin:0;color:var(--muted);white-space:pre-line}

.notice{padding:20px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
footer{padding-block:48px 40px;color:var(--muted);font-size:14px}
footer .bar{border-top:1px solid var(--line);padding-top:24px}
footer nav{display:flex;gap:20px}

/* Promo-banner, zoals de grote kaarten in de App Store */
.promo-wrap{margin-bottom:20px}
.promo-rail{display:grid;grid-auto-flow:column;grid-auto-columns:100%;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:24px}
.promo-rail::-webkit-scrollbar{display:none}
.promo-rail.multi{grid-auto-columns:min(100%,880px)}
.promo{position:relative;isolation:isolate;border-radius:24px;overflow:hidden;aspect-ratio:16/8;min-height:300px;max-height:460px;max-width:100%;scroll-snap-align:start;background:var(--stage);color:var(--on-stage)}
.promo .bg{position:absolute;inset:0;z-index:-2}
.promo .bg img{width:100%;height:100%;object-fit:cover;display:block}
.promo .bg.fromicon img{transform:scale(1.7);filter:blur(42px) saturate(1.5)}
.promo::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,var(--scrim-top) 0%,var(--scrim-clear) 38%,var(--scrim-clear) 55%,var(--scrim-bottom) 100%)}
.promo .head{position:absolute;top:0;left:0;right:0;padding:24px 28px;display:flex;flex-direction:column;gap:8px;max-width:640px}
.promo .head .eyebrow{color:var(--on-stage-2)}
.promo .head h3{font-size:clamp(28px,4.2vw,46px);line-height:1.02;font-weight:800;letter-spacing:-.03em;color:var(--on-stage)}
.promo .head p{margin:4px 0 0;font-size:16px;color:var(--on-stage-2);max-width:46ch}
.promo .bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--stage-bar)}
.promo .bar .icon{width:48px;height:48px;border-radius:11px;font-size:16px;box-shadow:0 0 0 1px var(--on-stage-ring)}
.promo .bar .txt{flex:1;min-width:0}
.promo .bar b{display:block;font-family:var(--f-display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.promo .bar span{display:block;font-size:13px;color:var(--on-stage-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.promo .get{flex:none;font:700 14px var(--f-body);padding:8px 20px;border-radius:99px;background:var(--on-stage);color:var(--get-ink);text-decoration:none}
.promo .get:hover{background:var(--get-hover)}
/* Banner met eigen ontwerp: volledig beeld op elk scherm, geen tekst eroverheen, balk eronder */
.promo.has-img{aspect-ratio:auto;min-height:0;max-height:none;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.promo.has-img::after{display:none}
.promo.has-img .bg{position:static;z-index:auto;aspect-ratio:16/9;background:var(--stage)}
.promo.has-img .bg img{object-fit:cover}
.promo.has-img .bar{position:static;background:var(--surface);padding:12px 16px}
.promo.has-img .bar .icon{box-shadow:inset 0 0 0 1px var(--ring)}
.promo.has-img .bar span{color:var(--muted)}
.promo.has-img .get{background:var(--accent);color:var(--on-accent)}
.promo.has-img .get:hover{background:var(--accent);opacity:.9}
.promo-dots{display:flex;justify-content:center;gap:8px;margin-top:12px}
.promo-dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.promo-dots button[aria-current="true"]{background:var(--ink)}

@media (max-width:860px){

troke-linejoin=\"round\"", "<rect x=\"14\" y=\"4\" width=\"20\" height=\"40\" rx=\"5\"/><circle cx=\"24\" cy=\"9\" r=\"1.3\" fill=\"currentColor\"/>"], "Android TV": ["0 0 48 48", "fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"", "<rect x=\"4\" y=\"8\" width=\"40\" height=\"26\" rx=\"3\"/><path d=\"M17 41h14M24 34v7\"/>"], "Samsung TV": ["0 0 48 48", "fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"", "<rect x=\"4\" y=\"8\" width=\"40\" height=\"26\" rx=\"3\"/><path d=\"M17 41h14M24 34v7\"/>"], "Web": ["0 0 48 48", "fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"", "<circle cx=\"24\" cy=\"24\" r=\"19\"/><path d=\"M5 24h38M24 5c5.5 5.2 8 11.6 8 19s-2.5 13.8-8 19c-5.5-5.2-8-11.6-8-19s2.5-13.8 8-19z\"/>"], "Homey Pro": ["0 0 48 48", "fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"", "<path d=\"M6 33a18 18 0 0 1 36 0z\"/><path d=\"M4 38h40\"/><circle cx=\"24\" cy=\"25\" r=\"2\" fill=\"currentColor\"/>"], "Homey Cloud": ["0 0 48 48", "fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"", "<path d=\"M14 37h21a8.5 8.5 0 0 0 1.2-16.9A11.5 11.5 0 0 0 14.1 22 7.5 7.5 0 0 0 14 37z\"/>"], "Homey": ["0 0 48 48", "fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"", "<path d=\"M6 33a18 18 0 0 1 36 0z\"/><path d=\"M4 38h40\"/><circle cx=\"24\" cy=\"25\" r=\"2\" fill=\"currentColor\"/>"], "Browser": ["0 0 48 48", "fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"", "<circle cx=\"24\" cy=\"24\" r=\"19\"/><path d=\"M5 24h38M24 5c5.5 5.2 8 11.6 8 19s-2.5 13.8-8 19c-5.5-5.2-8-11.6-8-19s2.5-13.8 8-19z\"/>"]};
const PLAT_ALIAS = { local:"Homey Pro", cloud:"Homey Cloud", browser:"Web" };
const platName = p => PLAT_ALIAS[String(p).toLowerCase()] || p;
const platSvg = p => { const v = PLAT_ICONS[platName(p)]; return v ? `<svg viewBox="${v[0]}" ${v[1]} aria-hidden="true">${v[2]}</svg>` : ""; };
const platTag = p => `<span class="tag ostag">${platSvg(p)}${esc(platName(p))}</span>`;
let ALL_APPS = [], lang = "nl", cat = "all", open = null, q = "";
const norm = x => String(x || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
function matches(a){
  if (!q) return true;
  const hay = norm([a.name, L(a.subtitle), L(a.description), a.category, catName(a.category), a.homey && a.homey.category,
                    (a.platforms || []).join(" ")].join(" "));
  return norm(q).split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
Object.defineProperty(window, "APPS", { get: () => ALL_APPS.filter(a => !(lang === "en" && a.nlOnly)) });

// De taal volgt het adres: / is Nederlands, /en/ is Engels (zodat een gedeelde link de juiste taal en OG-afbeelding heeft)
lang = window.LR_LANG === "en" ? "en" : "nl";
try { localStorage.setItem("lr-lang", lang); } catch(e){}

const t = k => T[lang][k];
const L = v => v == null ? "" : (typeof v === "string" ? v : (v[lang] ?? v.nl ?? v.en ?? ""));
const catName = c => T[lang].cats[c] || c;
const num = n => n.toFixed(1).replace(".", lang==="nl" ? "," : ".");
function date(d){
  if (!d || d.length === 4) return d || "";
  const x = new Date(d + "T12:00:00");
  return isNaN(x) ? d : new Intl.DateTimeFormat(lang==="nl"?"nl-NL":"en-GB",{day:"numeric",month:"short",year:"numeric"}).format(x);
}
// Adres van de eigen app-pagina: /app/<naam>/ (iOS) of /homey/<naam>/; zelfde regels als scripts/appslug.py
function slugify(n){ return String(n||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "app"; }
const pageKind = a => a.section === "homey" ? "homey" : "app";
function pageSlug(a){
  const base = slugify(a.name);
  const same = ALL_APPS.filter(o => slugify(o.name) === base && pageKind(o) === pageKind(a));
  const i = same.indexOf(a);
  return same.length > 1 && i > 0 ? base + "-" + (i + 1) : base;
}
const pageUrl = a => (lang === "en" && !a.nlOnly ? "/en" : "") + "/" + pageKind(a) + "/" + pageSlug(a) + "/";
function icon(a, cls=""){
  const init = esc(a.name.replace(/[^A-Za-z0-9]/g,"").slice(0,2));
  return `<span class="icon ${cls}">${init}${a.icon?`<img src="${esc(a.icon)}" alt="${esc(a.name)}" width="256" height="256" loading="lazy" decoding="async" onerror="this.remove()">`:""}</span>`;
}
function ctas(a, max=9){
  const l = a.links || {}, out = [];
  if (l.appstore)   out.push([l.appstore, t("appstore")]);
  if (l.testflight) out.push([l.testflight, t("testflight")]);
  if (l.website)    out.push([l.website, t("website")]);
  return out.slice(0,max).map(([u,label],i)=>`<a class="btn ${i===0?"primary":""}" href="${esc(u)}" target="_blank" rel="noopener">${esc(label)}</a>`).join("");
}

function renderStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = t(el.dataset.t); if (v == null) return;
    if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
  });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("#filters").setAttribute("aria-label", lang==="nl" ? "Filter op categorie" : "Filter by category");
  $("#q").placeholder = t("searchPh");
  $("#q").setAttribute("aria-label", t("search"));
}

// Nieuwste eerst: datum toegevoegd, daarna de laatste versie
const lastRelease = a => (a.history || []).reduce((m, h) => (h.date || "") > m ? h.date : m, "");
const newestFirst = (a, b) => (b.added || "").localeCompare(a.added || "") || lastRelease(b).localeCompare(lastRelease(a));
function render(){
  renderStatic();
  if (!APPS.length) return;
  const ios = APPS.filter(a => a.section === "ios");
  const live = ios.filter(a => a.status === "live");
  const homey = APPS.filter(a => a.section === "homey");
  $("#stLive").textContent = live.length;
  $("#stDev").textContent = ios.filter(a => a.status !== "live").length;
  $("#stHomey").textContent = homey.length;

  // Promo-banners
  const promos = ios.filter(a => a.promo && a.promo.show).sort(newestFirst);
  $("#promoWrap").hidden = !promos.length;
  $("#promo").classList.toggle("multi", promos.length > 1);
  $("#promo").innerHTML = promos.map((a, i) => {
    const p = a.promo, l = a.links || {};
    const [url, label] = l.appstore ? [l.appstore, t("getStore")] : l.testflight ? [l.testflight, t("getBeta")] : l.website ? [l.website, t("getSite")] : [null, null];
    const img = typeof p.image === "string" ? p.image : L(p.image);
    const bg = img ? `<div class="bg"><img src="${esc(img)}" alt="" width="1600" height="900" decoding="async"${i ? ` loading="lazy"` : ""}></div>`
                       : (a.icon ? `<div class="bg fromicon"><img src="${esc(a.icon)}" alt=""></div>` : `<div class="bg"></div>`);
    const title = L(p.title) || a.name;
    return `<article class="promo${img ? " has-img" : ""}" aria-label="${esc(img ? (title + (L(p.text) ? ". " + L(p.text) : "")) : a.name)}">
      ${bg}
      ${img ? "" : `<div class="head">
        <span class="eyebrow">${esc(L(p.eyebrow) || t(a.status))}</span>
        <h3>${esc(title)}</h3>
        ${L(p.text) ? `<p>${esc(L(p.text))}</p>` : ""}
      </div>`}
      <div class="bar">
        ${icon(a)}
        <div class="txt"><b>${esc(a.name)}</b><span>${esc(L(a.subtitle) || catName(a.category))}</span></div>
        ${url ? `<a class="get" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>` : ""}
      </div>
    </article>`;
  }).join("");
  $("#promoDots").innerHTML = promos.length > 1 ? promos.map((a,i) => `<button type="button" data-promo="${i}" aria-label="${esc(a.name)}" aria-current="${i===0}"></button>`).join("") : "";
  startPromoTimer();

  // Uitgelicht: featured, of alles wat nog niet live is
  // Alleen apps die in beheer zijn aangevinkt bij "Tonen in Nieuw en onderweg"
  const feat = ios.filter(a => a.featured === true).sort(newestFirst);
  $("#nieuw").hidden = !feat.length || !!q;
  $("#lab").innerHTML = feat.map(a => `
    <article class="lab-card">
      <span class="pill ${a.status}">${esc(t(a.status))}</span>
      <div class="lab-top">${icon(a,"lg")}<div><h3><a class="lablink" href="${esc(pageUrl(a))}">${esc(a.name)}</a></h3>${a.subtitle?`<div class="eyebrow" style="margin-top:2px">${esc(L(a.subtitle))}</div>`:""}</div></div>
      <p>${esc(L(a.description))}</p>
      <div class="plat">${(a.platforms||[]).map(platTag).join("")}</div>
      ${ctas(a,1)}
    </article>`).join("");

  const cats = ["all", ...new Set(live.map(a => a.category))];
  if (!cats.includes(cat)) cat = "all";
  $("#filters").innerHTML = cats.map(c => {
    const n = c==="all" ? live.length : live.filter(a=>a.category===c).length;
    return `<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${c===cat}">${esc(c==="all"?t("all"):catName(c))}<span class="n">${n}</span></button>`;
  }).join("");

  const liveShown = live.filter(a => (q || cat==="all" || a.category===cat) && matches(a));
  $("#filters").hidden = !!q;
  $("#apps").hidden = !liveShown.length;
  renderGrid($("#grid"), "detailSlot", liveShown);

  // TestFlight: wel een TestFlight-link, nog geen App Store-link
  const tf = ios.filter(a => a.links && a.links.testflight && !a.links.appstore && matches(a));
  $("#testflight").hidden = !tf.length;
  $("#navTf").hidden = !tf.length;
  renderGrid($("#tfGrid"), "tfSlot", tf);

  renderHomey();
  const found = liveShown.length + tf.length + (q ? APPS.filter(a => a.section === "homey" && matches(a)).length : 1);
  $("#searchEmpty").hidden = !q || found > 0;
  $("#searchEmpty").textContent = t("searchNone").replace("{q}", q);
  $("#qClear").hidden = !q;
}

function renderGrid(gridEl, slotId, list){
  gridEl.innerHTML = list.map(a => `
    <a class="app" href="${esc(pageUrl(a))}" data-id="${esc(a.id)}">
      ${icon(a)}
      <div style="min-width:0">
        <h3>${esc(a.name)}</h3>
        <div class="cat">${esc(catName(a.category))}${a.badge?`, ${esc(L(a.badge))}`:""}</div>
        <div class="meta"><span>${!(a.links&&a.links.appstore)?esc(t(a.status)):a.rating?`<span class="stars" aria-hidden="true">★★★★★</span> ${num(a.rating)}`:esc(t("noRating"))}</span>${a.history&&a.history.length?`<span class="mono">v${esc(a.history[0].version)}</span>`:""}</div>
      </div>
    </a>`).join("");

  // Een tik op een app opent direct zijn eigen pagina; het uitklappaneel wordt niet meer gebruikt
  const a = null;
  $("#"+slotId).innerHTML = !a ? "" : `
    <div class="detail ${a.history&&a.history.length?"":"single"}">
      <div>
        <div class="lead">${icon(a,"lg")}<div><h3>${esc(a.name)}</h3><div style="color:var(--muted);font-size:14px">${esc(t("dev_by"))}</div></div></div>
        <p>${esc(L(a.description))}</p>
        <div class="plat">${(a.platforms||[]).map(platTag).join("")}</div>
        <dl class="facts">
          ${a.links&&a.links.appstore?`<div><dt>${esc(t("rating"))}</dt><dd>${a.rating?num(a.rating)+" ★":"–"}</dd></div>
          <div><dt>${esc(t("reviews"))}</dt><dd>${a.reviews||0}</dd></div>`:""}
          <div><dt>${esc(t("age"))}</dt><dd>4+</dd></div>
          <div><dt>${esc(t("category"))}</dt><dd>${esc(catName(a.category))}</dd></div>
          <div><dt>${esc(t("language"))}</dt><dd>${esc(a.languages||"–")}</dd></div>
          <div><dt>${esc(t("size"))}</dt><dd>${esc(a.size||"–")}</dd></div>
        </dl>
        <div class="btns">${ctas(a)}<a class="btn" href="${esc(pageUrl(a))}">${esc(t("more").replace("{n}", a.name))}</a></div>
      </div>
      ${a.history&&a.history.length?`<div class="history"><h4>${esc(t("history"))}</h4><ol>${a.history.map((h,i)=>`<li class="${i>=2?"more":""}"><div><div class="mono">${esc(h.version)}</div><div class="d">${esc(date(h.date))}</div></div><p>${esc(L(h.notes))}</p></li>`).join("")}</ol>${a.history.length>2?`<button type="button" class="showall hist" data-n="${a.history.length}">${esc(t("hAll").replace("{n}", a.history.length))}</button>`:""}</div>`:""}
    </div>`;

}

// ---------- Homey: lijst met uitklapbare details ----------
let openHomey = null;
const flowTitle = txt => String(txt || "")
  .replace(/!\{\{([^|}]*)\|[^}]*\}\}/g, "$1")   // !{{is|isn't}} -> is
  .replace(/\[\[[^\]]*\]\]/g, "…")                // [[argument]] -> …
  .replace(/\{\{[^}]*\}\}/g, "…");
// Live- en testversie van een Homey-app; een testversie gelijk aan live wordt niet getoond
function homeyVersions(h){
  const x = h.homey || {}, hist = h.history || [];
  let live = x.live || (h.status === "live" ? ((hist.find(e => !e.test) || {}).version) : null);
  let test = x.test || (h.status !== "live" ? (hist[0] || {}).version : (hist[0] && hist[0].test ? hist[0].version : null));
  if (test && live && String(test) === String(live)) test = null;
  const testUrl = h.links && (h.links.homeyTest || (h.status !== "live" ? h.links.homey : ""));
  return { live: live || null, test: test || null, testUrl: test ? (testUrl || "").replace("/nl-nl/", lang==="nl" ? "/nl-nl/" : "/en-us/") : "" };
}
const verTags = v => (v.live ? `<span class="mono vtag live">${esc(t("hLive"))} v${esc(v.live)}</span>` : "")
  + (v.test ? `<span class="mono vtag test">${esc(t("hTest"))} v${esc(v.test)}</span>` : "");
const homeyUrl = h => (h.links && h.links.homey ? h.links.homey : "").replace("/nl-nl/", lang==="nl" ? "/nl-nl/" : "/en-us/");

function homeyDetail(h){
  const x = h.homey || {}, last = (h.history || [])[0];
  const plat = (x.platforms || []).map(p => p === "local" ? "Homey Pro" : p === "cloud" ? "Homey Cloud" : p);
  const facts = [
    ...plat.map(platTag),
    x.compatibility ? `<span class="tag">Homey ${esc(x.compatibility.replace(/^>=\s*/, "v").replace(/^v?(\d)/, "v$1"))}+</span>` : "",
  ].join("");
  const v = homeyVersions(h);
  const btns = [
    v.live && homeyUrl(h) ? `<a class="btn primary" href="${esc(homeyUrl(h))}" target="_blank" rel="noopener">${esc(t("hStore"))}</a>` : "",
    v.test && v.testUrl ? `<a class="btn ${v.live ? "" : "primary"} testbtn" href="${esc(v.testUrl)}" target="_blank" rel="noopener">${esc(t("hTestBtn"))} <span class="mono">v${esc(v.test)}</span></a>` : "",
    x.homepage ? `<a class="btn" href="${esc(x.homepage)}" target="_blank" rel="noopener">${esc(t("hSite"))}</a>` : "",
    x.support ? `<a class="btn" href="${esc(x.support)}" target="_blank" rel="noopener">${esc(t("hSupport"))}</a>` : "",
  ].join("");
  const drivers = (x.drivers || []).map(d => `
    <div class="hd-driver">
      ${d.image ? `<span class="img"><img src="${esc(d.image)}" alt="" loading="lazy"></span>`
                : `<span class="img ic" style="--hc:${esc(x.color || "#2747E8")}">${d.icon ? `<img src="${esc(d.icon)}" alt="" loading="lazy">` : ""}</span>`}
      <span>${esc(L(d.name))}</span>
    </div>`).join("");
  const widgets = (x.widgets || []).map(w => `
    <figure class="hd-widget">
      ${w.light ? `<img class="wl" src="${esc(w.light)}" alt="" loading="lazy">` : ""}
      ${w.dark || w.light ? `<img class="wd" src="${esc(w.dark || w.light)}" alt="" loading="lazy">` : ""}
      <figcaption>${esc(L(w.name))}</figcaption>
    </figure>`).join("");
  const SHOW = 6;
  const col = (cls, key, cards) => !cards || !cards.length ? "" : `
    <div class="hd-col ${cls}">
      <h5>${esc(t(key))} <small style="font-weight:500;color:var(--muted);letter-spacing:0;text-transform:none">${cards.length}</small></h5>
      <ol>${cards.map((c,i) => `<li class="${i >= SHOW ? "more" : ""}">${esc(flowTitle(L(c.title)))}</li>`).join("")}</ol>
      ${cards.length > SHOW ? `<button type="button" class="showall" data-n="${cards.length}">${esc(t("hAll").replace("{n}", cards.length))}</button>` : ""}
    </div>`;
  const f = x.flow || {};
  const nFlow = ["triggers","conditions","actions"].reduce((n,k) => n + ((f[k] || []).length), 0);
  const news = (h.history || []).slice(0, 3).filter(e => L(e.notes)).map(e => `
    <div><span><span class="v">v${esc(e.version)}</span>${e.test ? ` <span class="pill beta">${esc(t("h_beta"))}</span>` : ""}<br><span class="d">${esc(date(e.date))}</span></span><p>${esc(L(e.notes))}</p></div>`).join("");
  return `
    <div class="hd-head">
      ${icon(h, "lg")}
      <div style="min-width:0">
        <h3>${esc(h.name)}${h.status!=="live"?` <span class="pill ${h.status}">${esc(t("h_"+h.status))}</span>`:""}</h3>
        <div class="sub">${verTags(v)}${h.rating ? `<span><span class="stars" aria-hidden="true">★</span> ${num(h.rating)}</span>` : ""}</div>
      </div>
      <button type="button" class="hd-close" data-hclose aria-label="${esc(t("hClose"))}">×</button>
      <div class="btns" style="grid-column:1/-1">${btns}<a class="btn" href="${esc(pageUrl(h))}">${esc(t("more").replace("{n}", h.name))}</a></div>
    </div>
    ${L(h.description) ? `<p class="hd-desc">${esc(L(h.description))}</p>` : ""}
    ${facts ? `<div class="hd-facts">${facts}</div>` : ""}
    ${drivers ? `<section class="hd-sec"><h4>${esc(t("hDevices"))} <small>${(x.drivers||[]).length}</small></h4><div class="hd-drivers">${drivers}</div></section>` : ""}
    ${widgets ? `<section class="hd-sec"><h4>${esc(t("hWidgets"))} <small>${(x.widgets||[]).length}</small></h4><div class="hd-widgets">${widgets}</div></section>` : ""}
    ${nFlow ? `<section class="hd-sec"><h4>${esc(t("hFlow"))} <small>${nFlow}</small></h4><div class="hd-flow">${col("when","hWhen",f.triggers)}${col("and","hAnd",f.conditions)}${col("then","hThen",f.actions)}</div></section>` : ""}
    ${news ? `<section class="hd-sec"><h4>${esc(t("hNews"))}</h4><div class="hd-news">${news}</div></section>` : ""}`;
}

let hcat = "all";
const hcatName = c => (T[lang].hcats || {})[c] || c;
function renderHomey(){
  const homey = APPS.filter(a => a.section === "homey");
  const catOf = h => (h.homey && h.homey.category) || "";
  const cats = ["all", ...new Set(homey.map(catOf).filter(Boolean))];
  if (!cats.includes(hcat)) hcat = "all";
  $("#hfilters").innerHTML = cats.length > 2 ? cats.map(c => {
    const n = c === "all" ? homey.length : homey.filter(h => catOf(h) === c).length;
    return `<button class="chip" type="button" data-hcat="${esc(c)}" aria-pressed="${c===hcat}">${esc(c==="all"?t("all"):hcatName(c))}<span class="n">${n}</span></button>`;
  }).join("") : "";
  $("#hfilters").hidden = cats.length <= 2;
  $("#hfilters").setAttribute("aria-label", lang==="nl" ? "Filter Homey-apps" : "Filter Homey apps");
  const list = homey.filter(h => (q || hcat === "all" || catOf(h) === hcat) && matches(h));
  $("#homey").hidden = !list.length;
  if (q) $("#hfilters").hidden = true;
  if (openHomey && !list.some(h => h.id === openHomey)) openHomey = null;
  $("#homeyList").innerHTML = list.map(h => {
    const last = (h.history || [])[0];
    const v = homeyVersions(h);
    const meta = [h.rating ? `<span><span class="stars" aria-hidden="true">★★★★★</span> ${num(h.rating)}</span>` : "",
                  verTags(v)].join("");
    return `<a class="app hitem" href="${esc(pageUrl(h))}" data-hid="${esc(h.id)}">
      ${icon(h)}
      <div style="min-width:0">
        <h3>${esc(h.name)}${h.status!=="live"?` <span class="pill ${h.status}">${esc(t("h_"+h.status))}</span>`:""}</h3>
        <div class="cat">${esc(catOf(h) ? hcatName(catOf(h)) : "Homey")}</div>
        <div class="meta">${meta}</div>
      </div>
    </a>`;
  }).join("");
}

// Het detailpaneel komt onder de rij van de aangeklikte app, over de volle breedte.
function placeHomeyDetail(){
  const grid = $("#homeyList"); grid.querySelector(".hdetail")?.remove();
  if (!openHomey) return;
  const h = APPS.find(a => a.id === openHomey); if (!h) return;
  const items = [...grid.querySelectorAll(":scope > .hitem")];
  const idx = items.findIndex(b => b.dataset.hid === openHomey); if (idx < 0) return;
  const cols = getComputedStyle(grid).gridTemplateColumns.split(" ").filter(Boolean).length || 1;
  const rowEnd = Math.min(items.length - 1, Math.floor(idx / cols) * cols + cols - 1);
  const box = document.createElement("div"); box.className = "hdetail"; box.id = "homeyDetail";
  box.setAttribute("role", "region"); box.setAttribute("aria-label", h.name);
  box.innerHTML = homeyDetail(h);
  items[rowEnd].after(box);
}
let lastCols = 0;
window.addEventListener("resize", () => {
  const cols = getComputedStyle($("#homeyList")).gridTemplateColumns.split(" ").length;
  if (cols !== lastCols) { lastCols = cols; placeHomeyDetail(); }
}, {passive:true});

// Promo-banners: elke 8 seconden automatisch naar de volgende.
// Pauzeert bij muis erop, toetsenbordfocus, aanraken en als de pagina niet zichtbaar is.
const PROMO_MS = 8000;
let promoTimer = null, promoPaused = false;
function promoIndex(){
  const r = $("#promo"), cards = [...r.children]; if (!cards.length) return 0;
  return Math.min(cards.length - 1, Math.round(r.scrollLeft / (cards[0].offsetWidth + 16)));
}
function goPromo(i){
  const r = $("#promo"), c = r.children[i]; if (!c) return;
  r.scrollTo({ left: c.offsetLeft - r.offsetLeft, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
function startPromoTimer(){
  clearInterval(promoTimer); promoTimer = null;
  if ($("#promo").children.length < 2) return;
  promoTimer = setInterval(() => {
    if (promoPaused || document.hidden) return;
    const n = $("#promo").children.length;
    goPromo((promoIndex() + 1) % n);
  }, PROMO_MS);
}
["mouseenter","focusin","touchstart"].forEach(ev => $("#promo").addEventListener(ev, () => { promoPaused = true; }, {passive:true}));
["mouseleave","focusout"].forEach(ev => $("#promo").addEventListener(ev, () => { promoPaused = false; startPromoTimer(); }));
$("#promo").addEventListener("touchend", () => { promoPaused = false; startPromoTimer(); }, {passive:true});

$("#promo").addEventListener("scroll", () => {
  if ($("#promo").children.length < 2) return;
  const i = promoIndex();
  document.querySelectorAll("#promoDots button").forEach((b,j) => b.setAttribute("aria-current", j===i));
}, {passive:true});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && openHomey) document.querySelector("[data-hclose]")?.click();
});

document.addEventListener("click", e => {
  if (e.target.closest("a.app")) return;  // gewoon naar de app-pagina
  const pd = e.target.closest("[data-promo]");
  if (pd){ goPromo(+pd.dataset.promo); startPromoTimer(); return; }
  const lb = e.target.closest(".lang button");
  if (lb){ if (lb.dataset.lang !== lang){ try{localStorage.setItem("lr-lang",lb.dataset.lang)}catch(_){} location.href = (lb.dataset.lang === "en" ? "/en/" : "/") + location.hash; } return; }
  const hc = e.target.closest("[data-hcat]");
  if (hc){ hcat = hc.dataset.hcat; renderHomey(); return; }
  const ch = e.target.closest(".chip");
  if (ch){ cat = ch.dataset.cat; render(); return; }
  const hi = e.target.closest(".hitem");
  if (hi){
    openHomey = openHomey === hi.dataset.hid ? null : hi.dataset.hid;
    document.querySelectorAll(".hitem").forEach(b => b.setAttribute("aria-expanded", b.dataset.hid === openHomey));
    placeHomeyDetail();
    if (openHomey) $("#homeyDetail")?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"nearest"});
    return;
  }
  if (e.target.closest("[data-hclose]")){
    const was = openHomey; openHomey = null;
    document.querySelectorAll(".hitem").forEach(b => b.setAttribute("aria-expanded", "false"));
    placeHomeyDetail();
    document.querySelector(`.hitem[data-hid="${CSS.escape(was)}"]`)?.focus();
    return;
  }
  const sa = e.target.closest(".showall");
  if (sa){
    const c = sa.closest(".hd-col, .history"); c.classList.toggle("open");
    sa.textContent = c.classList.contains("open") ? t("hLess") : t("hAll").replace("{n}", sa.dataset.n);
    return;
  }
  const ap = e.target.closest(".app");
  if (ap){ open = open===ap.dataset.id ? null : ap.dataset.id; render();
    if (open) document.getElementById(ap.getAttribute("aria-controls"))?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"nearest"}); }
});

$("#q").addEventListener("input", e => { q = e.target.value.trim(); open = null; render(); });
$("#qClear").addEventListener("click", () => { $("#q").value = ""; q = ""; render(); $("#q").focus(); });
renderStatic();
fetch("/apps.json", {cache:"no-cache"})
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { ALL_APPS = d.apps || []; render(); })
  .catch(() => { $("#grid").innerHTML = `<div class="notice">${esc(t("loadError"))}</div>`; });
</script>
