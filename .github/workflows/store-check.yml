name: Store-check

# Twee keer per dag de App Store en de Homey App Store nalopen (modus "alles"):
# nieuwe apps toevoegen, beta-apps aanvullen zodra ze in de store staan,
# versies, wat-is-nieuw (NL en EN), sterren en aantal beoordelingen.
# Ook te starten in beheer: "Nieuwe apps ophalen" (modus nieuw) en "Apps bijwerken" (modus bijwerken).
# Bij wijzigingen wordt site/apps.json bijgewerkt en de site via "Release site" opnieuw live gezet.
#
# GitHub start geplande taken vaak uren te laat. Daarom is er geen controle meer op het uur:
# elke geplande run doet gewoon de volledige check. Tijden in UTC (ca. 07:00 en 17:00 Nederlandse tijd).

on:
  schedule:
    - cron: "13 6 * * *"
    - cron: "13 16 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Wat ophalen"
        type: choice
        options: [alles, nieuw, bijwerken, toevoegen]
        default: alles
      url:
        description: "Alleen bij toevoegen: App Store-, Homey-, TestFlight- of website-link"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: store-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
      STORE_MODE: ${{ github.event.inputs.mode || 'alles' }}
      STORE_ADD: ${{ github.event.inputs.url || '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Pillow installeren (iconen van websites)
        if: github.event.inputs.mode == 'toevoegen'
        run: python3 -m pip install --quiet --break-system-packages pillow

      - name: Stores nalopen
        run: |
          echo "Nederlandse tijd: $(TZ=Europe/Amsterdam date '+%d-%m-%Y %H:%M'), modus: $STORE_MODE"
          python3 scripts/store_check.py site/apps.json
          cat store-check-summary.md >> "$GITHUB_STEP_SUMMARY"
          [ -f store-check-overview.md ] && cat store-check-overview.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Opslaan en live zetten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Store-check"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          site_changed() { ! git diff --quiet HEAD -- site/apps.json || [ -n "$(git status --porcelain -- site/img)" ]; }

          # Is er intussen iets anders op GitHub gezet (beheer, LRbeheer of een andere check), dan de check
          # opnieuw draaien op de nieuwste versie in plaats van samen te voegen. Zo gaat er nooit iets verloren.
          pushed=0; released=0
          for i in 1 2 3 4; do
            SITE_CHANGED=0; site_changed && SITE_CHANGED=1
            git add logs/store-check.json site/apps.json site/img
            if git diff --cached --quiet; then pushed=1; echo "Geen wijzigingen."; break; fi
            if [ "$SITE_CHANGED" = "1" ]; then git commit -q -F store-check-summary.md
            else git commit -q -m "Logboek store-check: geen wijzigingen"; fi
            if git push -q origin HEAD:main; then pushed=1; released=$SITE_CHANGED; break; fi
            echo "GitHub is intussen gewijzigd, check opnieuw op de nieuwste versie (poging $((i + 1)))."
            sleep $((i * 5))
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 scripts/store_check.py site/apps.json
          done
          [ "$pushed" = "1" ] || { echo "::error::Opslaan op GitHub mislukte na 4 pogingen."; exit 1; }
          if [ "$released" = "1" ]; then
            # Een push met de standaard-token start geen andere workflows; daarom expliciet de release starten.
            gh workflow run release.yml --ref main
            echo "Site wordt opnieuw live gezet."
          fi
