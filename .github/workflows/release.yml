name: Release site

# Elke wijziging in site/ (of handmatig starten):
# 1. bouwt de site met .htaccess en .htpasswd voor beheer.html,
# 2. zet hem via FTP direct live op lrvdlinden.app,
# 3. maakt een zip-release (zonder .htpasswd, want releases zijn publiek).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build_seo.py"
      - "scripts/build_app_pages.py"
      - "scripts/appslug.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # voor de lastmod-datums in sitemap.xml

      - name: Controleer secrets
        env:
          BEHEER_USER: ${{ secrets.BEHEER_USER }}
          BEHEER_PASSWORD: ${{ secrets.BEHEER_PASSWORD }}
          BEHEER_HTPASSWD_PATH: ${{ secrets.BEHEER_HTPASSWD_PATH }}
        run: |
          missing=""
          [ -z "$BEHEER_USER" ] && missing="$missing BEHEER_USER"
          [ -z "$BEHEER_PASSWORD" ] && missing="$missing BEHEER_PASSWORD"
          [ -z "$BEHEER_HTPASSWD_PATH" ] && missing="$missing BEHEER_HTPASSWD_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Ontbrekende secrets:$missing. Voeg ze toe onder Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Spaties, enters en aanhalingstekens rond het pad weghalen
          P=$(printf '%s' "$BEHEER_HTPASSWD_PATH" | tr -d '\r\n' | sed -e 's/^[[:space:]"'"'"']*//' -e 's/[[:space:]"'"'"']*$//')
          case "$P" in
            /*) ;;
            *)
              echo "::error::BEHEER_HTPASSWD_PATH moet beginnen met een / (nu ${#P} tekens, eerste teken is niet /). Voorbeelden: /home/GEBRUIKER/domains/lrvdlinden.app/public_html/.htpasswd (DirectAdmin), /home/GEBRUIKER/public_html/.htpasswd (cPanel), /var/www/vhosts/lrvdlinden.app/httpdocs/.htpasswd (Plesk)."
              exit 1 ;;
          esac
          case "$P" in
            */) P="${P}.htpasswd" ;;
          esac
          case "$P" in
            */.htpasswd) ;;
            *) echo "::warning::BEHEER_HTPASSWD_PATH eindigt niet op /.htpasswd. Het pad moet naar het bestand .htpasswd in je webroot wijzen." ;;
          esac

      - name: Installeer htpasswd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apache2-utils zip lftp

      - name: Bouw site
        env:
          PUBLISH_GITHUB_TOKEN: ${{ secrets.PUBLISH_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          BEHEER_USER: ${{ secrets.BEHEER_USER }}
          BEHEER_PASSWORD: ${{ secrets.BEHEER_PASSWORD }}
          BEHEER_HTPASSWD_PATH: ${{ secrets.BEHEER_HTPASSWD_PATH }}
        run: |
          BEHEER_HTPASSWD_PATH=$(printf '%s' "$BEHEER_HTPASSWD_PATH" | tr -d '\r\n' | sed -e 's/^[[:space:]"'"'"']*//' -e 's/[[:space:]"'"'"']*$//')
          case "$BEHEER_HTPASSWD_PATH" in */) BEHEER_HTPASSWD_PATH="${BEHEER_HTPASSWD_PATH}.htpasswd" ;; esac
          python3 -c "import json; json.load(open('site/apps.json'))" || { echo "::error::site/apps.json is geen geldige JSON"; exit 1; }
          rm -rf build && mkdir build
          cp -r site/. build/
          # sitemap.xml en gestructureerde gegevens (JSON-LD) voor zoekmachines
          # eigen pagina per app: /app/<naam>/ (teksten en screenshots uit site/app-content)
          python3 scripts/build_app_pages.py build
          python3 scripts/build_seo.py build

          # Wachtwoord via stdin, zodat het niet in de proceslijst verschijnt. bcrypt-hash.
          printf '%s' "$BEHEER_PASSWORD" | htpasswd -niB -C 12 "$BEHEER_USER" | sed '/^$/d' > build/.htpasswd

          # GitHub-token voor de Publiceren-knop (alleen op de server, nooit in repo of zip)
          if [ -n "$PUBLISH_GITHUB_TOKEN" ]; then
            TOKEN=$(printf '%s' "$PUBLISH_GITHUB_TOKEN" | tr -d '[:space:]')
            printf '%s' "$TOKEN" | grep -Eq '^[A-Za-z0-9_]+$' || { echo "::error::PUBLISH_GITHUB_TOKEN bevat ongeldige tekens."; exit 1; }
            printf "<?php\nreturn ['token' => '%s', 'repo' => '%s', 'branch' => 'main'];\n" "$TOKEN" "$GITHUB_REPOSITORY" > build/.publish-config.php
          else
            echo "::warning::Secret PUBLISH_GITHUB_TOKEN ontbreekt. De Publiceren-knop zet wijzigingen wel live, maar slaat ze niet op in GitHub."
          fi

          # Vertaalsleutel voor de knop "Vertaal NL → EN" in beheer.html (alleen op de server)
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            AK=$(printf '%s' "$ANTHROPIC_API_KEY" | tr -d '[:space:]')
            WS=$(printf '%s' "$ANTHROPIC_WORKSPACE_ID" | tr -d '[:space:]')
            printf '%s' "$AK$WS" | grep -Eq '^[A-Za-z0-9_-]*$' || { echo "::error::ANTHROPIC_API_KEY of ANTHROPIC_WORKSPACE_ID bevat ongeldige tekens."; exit 1; }
            printf "<?php\nreturn ['key' => '%s', 'workspace' => '%s', 'model' => 'claude-haiku-5-5'];\n" "$AK" "$WS" > build/.translate-config.php
          fi

          cat > build/.htaccess <<EOF
          AddDefaultCharset UTF-8
          AddCharset UTF-8 .html .json .svg

          # Beheerpagina en publiceren alleen met gebruikersnaam en wachtwoord
          <FilesMatch "^(beheer\.html|publish\.php|store-refresh\.php|store-log\.php|translate\.php)$">
            AuthType Basic
            AuthName "LRvdLinden beheer"
            AuthUserFile "${BEHEER_HTPASSWD_PATH}"
            Require valid-user
          </FilesMatch>

          # .htaccess, .htpasswd en de token-config nooit uitleveren
          <FilesMatch "^\.(ht|publish-config|translate-config)">
            Require all denied
          </FilesMatch>

          # Nette URL's zonder .html: /privacy toont privacy.html, /privacy.html stuurt door naar /privacy
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{THE_REQUEST} \s/+index\.html[\s?] [NC]
            RewriteRule ^index\.html$ / [R=301,L]
            RewriteCond %{THE_REQUEST} \s/+([^.?\s]+)\.html[\s?] [NC]
            RewriteRule ^ /%1 [R=301,L,NE]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{REQUEST_FILENAME}.html -f
            RewriteRule ^([a-z0-9-]+)/?$ \$1.html [L]
            # /app zonder naam: naar de lijst met apps
            RewriteRule ^app/?$ / [R=302,L]
          </IfModule>

          # apps.json altijd vers ophalen na een update
          <IfModule mod_headers.c>
            <Files "apps.json">
              Header set Cache-Control "no-cache"
            </Files>
          </IfModule>
          EOF
          sed -i 's/^          //' build/.htaccess

      - name: Zet live via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          for v in FTP_SERVER FTP_USER FTP_PASSWORD; do
            [ -z "${!v}" ] && { echo "::error::Secret $v ontbreekt."; exit 1; }
          done
          HOST=$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]' | sed -E 's#^[a-z]+://##; s#/.*$##')
          PORT=$(printf '%s' "${FTP_PORT:-21}" | tr -cd '0-9'); PORT=${PORT:-21}
          # Wachtwoord via omgevingsvariabele, zodat het niet in de opdrachtregel of logs staat
          FTP_USER=$(printf '%s' "$FTP_USER" | tr -d '[:space:]')
          export LFTP_PASSWORD="$(printf '%s' "$FTP_PASSWORD" | tr -d '\r\n')"

          if [ "$PORT" = "22" ]; then URL="sftp://$HOST"; else URL="ftp://$HOST"; fi
          SETTINGS="set sftp:auto-confirm yes; set ftp:ssl-allow yes; set ssl:verify-certificate no; set ftp:passive-mode yes; set net:timeout 25; set net:max-retries 2; set net:reconnect-interval-base 5"

          # Doelmap bepalen: secret FTP_DIR, anders public_html/lrvdlinden.app als het account in de thuismap begint
          if [ -n "$FTP_DIR" ]; then
            TARGET="$FTP_DIR"
          else
            ROOT=$(lftp --env-password -u "$FTP_USER" -p "$PORT" -e "$SETTINGS; cls -1; bye" "$URL" 2>&1) || { MSG=$(printf '%s' "$ROOT" | tail -3 | tr '\n' ' ' | cut -c1-300); echo "::error::Kan niet verbinden met de FTP-server (poort $PORT, ${URL%%://*}). Melding: $MSG"; exit 1; }
            if printf '%s\n' "$ROOT" | grep -qx 'public_html/\?'; then
              TARGET="public_html/lrvdlinden.app"
            else
              TARGET="."
            fi
          fi
          echo "Uploaden naar: $TARGET"

          lftp --env-password -u "$FTP_USER" -p "$PORT" -e "$SETTINGS; mkdir -p -f '$TARGET'; cd '$TARGET'; mirror --reverse --verbose=1 --parallel=4 --no-perms --exclude-glob .git* ./build/ ./; bye" "$URL"

      - name: Controleer live site
        run: |
          sleep 3
          code=$(curl -s -o /tmp/live.html -w '%{http_code}' "https://lrvdlinden.app/?v=${GITHUB_RUN_NUMBER}")
          echo "homepagina: HTTP $code"
          [ "$code" = "200" ] || { echo "::error::lrvdlinden.app geeft HTTP $code na upload. Klopt de doelmap? Zet eventueel secret FTP_DIR."; exit 1; }
          first=$(python3 -c "import json; print(json.load(open('build/app/pages.json'))[0]['slug'])")
          c=$(curl -s -o /dev/null -w '%{http_code}' "https://lrvdlinden.app/app/$first/")
          echo "/app/$first/: HTTP $c"
          [ "$c" = "200" ] || echo "::warning::De app-pagina /app/$first/ geeft HTTP $c."
          for pg in donate privacy; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "https://lrvdlinden.app/$pg")
            echo "/$pg: HTTP $c"
            [ "$c" = "200" ] || echo "::warning::/$pg geeft HTTP $c (nette URL's werken niet?)."
            r=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://lrvdlinden.app/$pg.html")
            echo "/$pg.html: $r"
          done
          curl -s "https://lrvdlinden.app/apps.json?v=${GITHUB_RUN_NUMBER}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d['apps']), 'apps live')"
          # /beheer.html mag doorsturen naar /beheer; daarna moet altijd een login volgen
          for u in beheer beheer.html; do
            b=$(curl -sL -o /dev/null -w '%{http_code}' "https://lrvdlinden.app/$u")
            echo "/$u zonder login (na doorsturen): HTTP $b"
            case "$b" in 401|403) ;; *) echo "::error::/$u is bereikbaar zonder login (HTTP $b)."; exit 1 ;; esac
          done
          for f in publish.php store-refresh.php store-log.php translate.php .publish-config.php .translate-config.php .htpasswd; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "https://lrvdlinden.app/$f")
            echo "$f zonder login: HTTP $c"
            case "$c" in 401|403) ;; *) echo "::error::$f is bereikbaar zonder login (HTTP $c)."; exit 1 ;; esac
          done

      - name: Maak zip
        id: zip
        run: |
          TAG="v$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          NAME="lrvdlinden-site-${TAG}.zip"
          (cd build && zip -qr "../${NAME}" . -x .htpasswd .publish-config.php .translate-config.php)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          unzip -l "${NAME}" | tail -1

      - name: Publiceer release
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message || 'Handmatige release' }}
        run: |
          {
            echo "${MSG}"
            echo
            echo "Deze versie is automatisch live gezet op https://lrvdlinden.app. De zip is een back-up (zonder .htpasswd)."
          } > notes.md
          gh release create "${{ steps.zip.outputs.tag }}" "${{ steps.zip.outputs.name }}" \
            --target "${GITHUB_SHA}" \
            --title "Site ${{ steps.zip.outputs.tag }}" \
            --notes-file notes.md

      - name: Content ophalen voor nieuwe apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Heeft een app nog geen content (screenshots, OG), dan meteen de content-sync starten.
          missing=$(python3 -c "
          import json, os
          pages = json.load(open('build/app/pages.json'))
          print(' '.join(p['slug'] for p in pages if not os.path.isfile(f\"site/app-content/{p['slug']}/content.json\")))")
          if [ -n "$missing" ]; then
            echo "Nog geen content voor: $missing"
            gh workflow run content-sync.yml --ref main
          fi
