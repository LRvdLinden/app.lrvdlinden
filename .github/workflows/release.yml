name: Release site

# Elke wijziging in site/ (of handmatig starten):
# 1. bouwt de site met .htaccess en .htpasswd voor beheer.html,
# 2. zet hem via FTP direct live op lrvdlinden.app,
# 3. maakt een zip-release (zonder .htpasswd, want releases zijn publiek).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Controleer secrets
        env:
          BEHEER_USER: ${{ secrets.BEHEER_USER }}
          BEHEER_PASSWORD: ${{ secrets.BEHEER_PASSWORD }}
          BEHEER_HTPASSWD_PATH: ${{ secrets.BEHEER_HTPASSWD_PATH }}
        run: |
          missing=""
          [ -z "$BEHEER_USER" ] && missing="$missing BEHEER_USER"
          [ -z "$BEHEER_PASSWORD" ] && missing="$missing BEHEER_PASSWORD"
          [ -z "$BEHEER_HTPASSWD_PATH" ] && missing="$missing BEHEER_HTPASSWD_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Ontbrekende secrets:$missing. Voeg ze toe onder Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Spaties, enters en aanhalingstekens rond het pad weghalen
          P=$(printf '%s' "$BEHEER_HTPASSWD_PATH" | tr -d '\r\n' | sed -e 's/^[[:space:]"'"'"']*//' -e 's/[[:space:]"'"'"']*$//')
          case "$P" in
            /*) ;;
            *)
              echo "::error::BEHEER_HTPASSWD_PATH moet beginnen met een / (nu ${#P} tekens, eerste teken is niet /). Voorbeelden: /home/GEBRUIKER/domains/lrvdlinden.app/public_html/.htpasswd (DirectAdmin), /home/GEBRUIKER/public_html/.htpasswd (cPanel), /var/www/vhosts/lrvdlinden.app/httpdocs/.htpasswd (Plesk)."
              exit 1 ;;
          esac
          case "$P" in
            */) P="${P}.htpasswd" ;;
          esac
          case "$P" in
            */.htpasswd) ;;
            *) echo "::warning::BEHEER_HTPASSWD_PATH eindigt niet op /.htpasswd. Het pad moet naar het bestand .htpasswd in je webroot wijzen." ;;
          esac

      - name: Installeer htpasswd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apache2-utils zip lftp

      - name: Bouw site
        env:
          BEHEER_USER: ${{ secrets.BEHEER_USER }}
          BEHEER_PASSWORD: ${{ secrets.BEHEER_PASSWORD }}
          BEHEER_HTPASSWD_PATH: ${{ secrets.BEHEER_HTPASSWD_PATH }}
        run: |
          BEHEER_HTPASSWD_PATH=$(printf '%s' "$BEHEER_HTPASSWD_PATH" | tr -d '\r\n' | sed -e 's/^[[:space:]"'"'"']*//' -e 's/[[:space:]"'"'"']*$//')
          case "$BEHEER_HTPASSWD_PATH" in */) BEHEER_HTPASSWD_PATH="${BEHEER_HTPASSWD_PATH}.htpasswd" ;; esac
          python3 -c "import json; json.load(open('site/apps.json'))" || { echo "::error::site/apps.json is geen geldige JSON"; exit 1; }
          rm -rf build && mkdir build
          cp -r site/. build/

          # Wachtwoord via stdin, zodat het niet in de proceslijst verschijnt. bcrypt-hash.
          printf '%s' "$BEHEER_PASSWORD" | htpasswd -niB -C 12 "$BEHEER_USER" | sed '/^$/d' > build/.htpasswd

          cat > build/.htaccess <<EOF
          AddDefaultCharset UTF-8
          AddCharset UTF-8 .html .json .svg

          # Beheerpagina alleen met gebruikersnaam en wachtwoord
          <Files "beheer.html">
            AuthType Basic
            AuthName "LRvdLinden beheer"
            AuthUserFile "${BEHEER_HTPASSWD_PATH}"
            Require valid-user
          </Files>

          # .htaccess en .htpasswd nooit uitleveren
          <FilesMatch "^\.ht">
            Require all denied
          </FilesMatch>

          # apps.json altijd vers ophalen na een update
          <IfModule mod_headers.c>
            <Files "apps.json">
              Header set Cache-Control "no-cache"
            </Files>
          </IfModule>
          EOF
          sed -i 's/^          //' build/.htaccess

      - name: Zet live via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          for v in FTP_SERVER FTP_USER FTP_PASSWORD; do
            [ -z "${!v}" ] && { echo "::error::Secret $v ontbreekt."; exit 1; }
          done
          HOST=$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]' | sed -E 's#^[a-z]+://##; s#/.*$##')
          PORT=$(printf '%s' "${FTP_PORT:-21}" | tr -cd '0-9'); PORT=${PORT:-21}
          # Wachtwoord via omgevingsvariabele, zodat het niet in de opdrachtregel of logs staat
          export LFTP_PASSWORD="$FTP_PASSWORD"

          if [ "$PORT" = "22" ]; then URL="sftp://$HOST"; else URL="ftp://$HOST"; fi
          SETTINGS="set sftp:auto-confirm yes; set ftp:ssl-allow yes; set ssl:verify-certificate no; set ftp:passive-mode yes; set net:timeout 25; set net:max-retries 2; set net:reconnect-interval-base 5"

          # Doelmap bepalen: secret FTP_DIR, anders public_html/lrvdlinden.app als het account in de thuismap begint
          if [ -n "$FTP_DIR" ]; then
            TARGET="$FTP_DIR"
          else
            ROOT=$(lftp --env-password -u "$FTP_USER" -p "$PORT" -e "$SETTINGS; cls -1; bye" "$URL" 2>&1) || { MSG=$(printf '%s' "$ROOT" | tail -3 | tr '\n' ' ' | cut -c1-300); echo "::error::Kan niet verbinden met de FTP-server (poort $PORT, ${URL%%://*}). Melding: $MSG"; exit 1; }
            if printf '%s\n' "$ROOT" | grep -qx 'public_html/\?'; then
              TARGET="public_html/lrvdlinden.app"
            else
              TARGET="."
            fi
          fi
          echo "Uploaden naar: $TARGET"

          lftp --env-password -u "$FTP_USER" -p "$PORT" -e "$SETTINGS; mkdir -p -f '$TARGET'; cd '$TARGET'; mirror --reverse --verbose=1 --parallel=4 --no-perms --exclude-glob .git* ./build/ ./; bye" "$URL"

      - name: Controleer live site
        run: |
          sleep 3
          code=$(curl -s -o /tmp/live.html -w '%{http_code}' "https://lrvdlinden.app/index.html?v=${GITHUB_RUN_NUMBER}")
          echo "index.html: HTTP $code"
          [ "$code" = "200" ] || { echo "::error::lrvdlinden.app/index.html geeft HTTP $code na upload. Klopt de doelmap? Zet eventueel secret FTP_DIR."; exit 1; }
          curl -s "https://lrvdlinden.app/apps.json?v=${GITHUB_RUN_NUMBER}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d['apps']), 'apps live')"
          b=$(curl -s -o /dev/null -w '%{http_code}' https://lrvdlinden.app/beheer.html)
          echo "beheer.html zonder login: HTTP $b"
          [ "$b" = "401" ] || echo "::warning::beheer.html geeft HTTP $b in plaats van 401 (inloggen vereist)."

      - name: Maak zip
        id: zip
        run: |
          TAG="v$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          NAME="lrvdlinden-site-${TAG}.zip"
          (cd build && zip -qr "../${NAME}" . -x .htpasswd)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          unzip -l "${NAME}" | tail -1

      - name: Publiceer release
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message || 'Handmatige release' }}
        run: |
          {
            echo "${MSG}"
            echo
            echo "Deze versie is automatisch live gezet op https://lrvdlinden.app. De zip is een back-up (zonder .htpasswd)."
          } > notes.md
          gh release create "${{ steps.zip.outputs.tag }}" "${{ steps.zip.outputs.name }}" \
            --target "${GITHUB_SHA}" \
            --title "Site ${{ steps.zip.outputs.tag }}" \
            --notes-file notes.md
