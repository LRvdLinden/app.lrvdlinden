name: LRbeheer compileren

# Compileert LRbeheer (beheer/, iOS 18+ en Mac Catalyst) zonder ondertekening, alleen als controle: geen artefacten,
# geen pakketten, geen geheimen. De Xcode-zip wordt buiten GitHub gemaakt (beheer/ heeft het project al in git).
# Fouten komen als annotaties in de run.

on:
  push:
    branches: [main]
    paths: ['beheer/**', '.github/workflows/beheer-build.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lrbeheer-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)

      - name: Xcode-versie kiezen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build iOS (generiek apparaat, zonder signing)
        id: ios
        continue-on-error: true
        working-directory: beheer
        run: |
          set -o pipefail
          xcodebuild build -project LRbeheer.xcodeproj -scheme LRbeheer \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/ios.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/ios.log"

      - name: Build Mac Catalyst (generieke Mac, zonder signing)
        id: mac
        continue-on-error: true
        working-directory: beheer
        run: |
          set -o pipefail
          xcodebuild build -project LRbeheer.xcodeproj -scheme LRbeheer \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/mac.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/mac.log"

      - name: Fouten als annotaties
        if: always()
        run: |
          for build in ios mac; do
            LOG="$RUNNER_TEMP/$build.log"
            [ -f "$LOG" ] || continue
            if [ "$build" = mac ]; then T="Mac Catalyst"; else T="iOS"; fi
            grep -E "^/.+:[0-9]+:[0-9]+: error: " "$LOG" | sort -u | head -40 | while IFS= read -r l; do
              f="${l%%:*}"; rest="${l#*:}"; line="${rest%%:*}"; msg="${l#*: error: }"
              echo "::error file=${f#$GITHUB_WORKSPACE/},line=$line,title=$T::$msg"
            done
            grep -E "error:" "$LOG" | grep -vE "^/.+:[0-9]+:[0-9]+: error: " | sort -u | head -15 | while IFS= read -r l; do
              echo "::error title=$T::$l"
            done
          done

      - name: Resultaat
        run: |
          echo "iOS: ${{ steps.ios.outcome }}, Mac Catalyst: ${{ steps.mac.outcome }}"
          [ "${{ steps.ios.outcome }}" = success ] && [ "${{ steps.mac.outcome }}" = success ]

      - name: Maak Xcode ZIP
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/LRbeheer-Xcode-build65.zip" HEAD beheer
          unzip -tq "$RUNNER_TEMP/LRbeheer-Xcode-build65.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: LRbeheer-Xcode-build65
          path: ${{ runner.temp }}/LRbeheer-Xcode-build65.zip
